  /adjustments/v2/visaAuthorizationIssues:
    post:
      tags:
      - Adjustments
      - External Agencies
      - Reference Data
      - Chargeback
      - Chargebacks
      - Retrieval
      - Retrievals
      summary: VISA_CB_OUTGOING_MANUAL RPC D1/I1
      description: "Use the VISA_CB_OUTGOING_MANUAL RPC to enter outgoing chargebacks\
        \ on Visa accounts into the First Data System. \nTo process certain outgoing\
        \ chargeback requests, input in the five message parameters text fields (messageParameterOneText,\
        \ messageParameterTwoText, ...) may be required. \nD1 - Domestic Issuer/Acquirer\
        \ Dispute Type Authorizations Issues. \nI1 - International Issuer/Acquirer\
        \ Dispute Type Authorizations Issues. \nNA - No Fast Track Form Needed. \n\
        Required Fields: fastTrackFormCode, chargeBackCurrencyCode, multipleClearingSequenceNumber,presentationInstrumentIdentifier,\
        \ feeAttributeCode, transactionDate, chargeBackTypeCode, messageReasonCode,\
        \ visaInterchangeProcessingDate, chargeBackTransactionTypeCode, transactionAmount,\
        \ chargeBackMessageCode, postDate, acquirerReferenceIdentifier, chargeBackActionCode,\
        \ chargeBackAmount. <br><br> <b>Relates to:</b>\n  \n  <blockquote style=\"\
        border-left: 0.375em solid #40a9ff; background-color: #e6f7ff; border-radius:\
        \ 3px; padding: 1em;\" ><div>VISA_CB_OUTGOING_MANUAL RPC, <a target=\"_blank\"\
        \ title=\"Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
