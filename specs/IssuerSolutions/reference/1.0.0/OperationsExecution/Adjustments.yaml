        \ rewards from other MasterCard\xAE members. The MC_OUTGOING_FEE_COLLECTION\
        \ RPC entered and the Integrated Product Message response appear on the next\
        \ day's SD-126, MasterCard Fee Income Journal, and the SD-127, MasterCard\
        \ Intra-FDR Fee Expense Journal. This function emulates the MRF transaction.\n\
        Required Fields: messageReasonCode, transactionOriginator, transactionDestination,\
        \ transactionDate, transactionAmount, processingDebitorCreditCode, functionCode,\
        \ controlIdentifier, dataRecord.<br><br> <b>Relates to:</b>\n  \n  <blockquote\
