    DeleteBatchAdjustmentRequest:
      required:
      - adjustmentBatchIdentifier
      - adjustmentLetterName
      - principalIdentifier
      - systemIdentifier
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        adjustmentLetterName:
          pattern: '[0-9]{4}'
          type: string
          description: Identifier of the adjustment batch
          example: '6791'
        adjustmentBatchIdentifier:
          pattern: '[A-Za-z0-9]{5}'
          type: string
          description: Identifier of the adjustment batch
          example: GXfwz
        systemIdentifier:
          pattern: '[0-9]{4}'
          type: string
          description: Number identifying the system
          example: '6171'
        principalIdentifier:
          pattern: '[0-9]{4}'
          type: string
          description: Number identifying the principal
          example: '0159'
    DualAdjustmentAddRequest:
      required:
      - batchPrefixIdentifier
      - merchantIdentifier
      - transactionAmount
      - transactionCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        batchPrefixIdentifier:
          type: string
          description: 'The batch prefix identifier corresponds to the first 2 letters
            of the batch number.

            Example: NS - Insufficient'
        transactionCode:
          type: string
          description: "#### Example Values:\n**253** - Sale \n**254** - Cash Advance\
            \ \n **255** - Return \n**256** - Merchandise Sale Reversal \n**257**\
            \ - Cash Advance Reversal \n**258** - Return Reversal \n**272** - Payment\
            \ Reversal"
        merchantIdentifier:
          type: string
          description: Identifier for the Merchant Account
        transactionAmount:
          type: string
          description: The transaction amount to adjust
        bypassCode:
          pattern: '[B ]'
          type: string
          description: "Code determining whether the reversal or transaction adjustment\
            \ is eligible to bypass \nthe supervisor review queuing feature of the\
            \ JRQ, Adjustment Review Queue Display Transaction\nValid codes in comments.\n\
            .#### Example Values: \n  blank - If the adjustment or reversal request\
            \ exceeds the amount established for an operator,           or a value\
            \ is entered in either the merchant description or merchant description\
            \ override fields,           automatically send the transaction to a supervisor\
            \ to review \n  B - Do not queue the adjustment or reversal request to\
            \ the JRQ transaction. \n"
          example: B
    FeeAdjustmentReversalRequest:
      required:
      - batchType
      - tranAmount
      - tranCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        batchType:
          pattern: '|[\d]{2}'
          type: string
          description: Identifier of the batch type, Length 2.
          example: ''
        batchPrefix:
          pattern: '|[\w\s]{2}'
          type: string
          description: Identifier of the batch prefix.
          example: ''
        tranCode:
          pattern: 256|257|272|259|260|273
          type: string
          description: "Code representing the monetary transaction, Length 3 Fixed.\
            \ \n#### Example Values: \n  **256** - Sale reversal/returned check charge\
            \ reversal \n  **257** - Cash advance reversal \n  **272** - Payment reversal\
            \ \n  **259** - Sale reversal/returned check charge reversal \n  **260**\
            \ - Cash advance reversal \n  **273** - Payment reversal."
          example: '260'
        tranDate:
          type: string
          description: 'Date the transaction originally posted to the customer account,
            Length 6 Fixed. Format MMDDYY. '
        merchantId:
          pattern: '|[\w\s\W]{6,16}'
          type: string
          description: Identifier of the merchant account.
          example: I1|zmL9ff]47!
        tranAmount:
          type: string
          description: Amount of the item being adjusted, Length 13, Format 9999999999.99
        referenceNumber:
          pattern: '|[\w\s\W]{1,23}'
          type: string
          description: Identifier of the item being reversed.
          example: eHU_Z*N= sM
        transactionPostingDate:
          type: string
          description: Date the original transaction occurred, Length 6 Fixed. Format
            MMDDYY.
        adjustedTranAmount:
          pattern: '|[\d]{1,10}\.?[0-9]{0,2}'
          type: string
          description: New amount of the item being adjusted, Length 13, Format 9999999999.99
          example: ''
        merchantDescriptionText:
          pattern: '|[\w\s\W\.]{1,37}'
          type: string
          description: Text of the client-defined message that describes the adjustment
            detail item being entered, Length 37.
          example: ''
        tranFeeAttr:
          pattern: '|[\w\s\W]{3}'
          type: string
          description: Identifier of the type of discounted interchange rate applicable
            for this transaction.
          example: ''
        promotionalId:
          pattern: '|[\w\s\W]{1,8}'
          type: string
          description: "PROMO ID Client-defined identifier of a promotional method\
            \ of the Transaction Level \n ProcessingSM (TLPSM) service. This field\
            \ displays for Transaction Level Processing service (TLP service) \ntransactions\
            \ only."
          example: "\rYtnu1E\n"
        promotionalBalanceId:
          pattern: '|[\d]{1,7}'
          type: string
          description: "BALANCE ID\nFirst Data-assigned identifier of the promotional\
            \ purchase\nThis field contains a value only for TLP transactions for\
            \ which a balance identification has already been generated on an account.\
            \ \nThe System requires this field if entering an adjustment for a specific\
            \ TLP balance.\nTo post a payment directly to a specific TLP balance,\
            \ enter the appropriate balance ID in this field. \nA value of 9999999\
            \ appears in this field when you post a payment directly to the standard\
            \ balance of the account.\n"
          example: ''
        controlId:
          pattern: '|[\w\s]{1,8}'
          type: string
          description: Identifier of the adjustment detail, Length 8.
          example: ''
        itemFeeMethodId:
          pattern: '|[\w\s\W]{1,8}'
          type: string
          description: "Identification of the item fee method used to process the\
            \ transaction. \nEnter an item fee method in this field to identify the\
            \ transaction level fee for the adjustment.\n."
          example: N
        planId:
          pattern: '|[\w\s\W]{1,8}'
          type: string
          description: "Method name assigned to the plan identifying the pricing method\
            \ used for the \n promotional balance associated with the plan, Length\
            \ 8."
          example: ''
        merchantDescriptionOverride:
          pattern: '|[\w\s\W]{1,23}'
          type: string
          description: Text that overrides the System-generated description, any Product
            Control File generated override, and the merchant description originally
            on the statement, Length 23.
          example: "_/[8Lbqi_S5+$OV\f"
        clientDefinedReference:
          pattern: '|[\w\s\W]{1,23}'
          type: string
          description: Client-defined reference identifier or invoice identifier of
            a specific transaction.Length 23.
          example: ilS[<l
        retailTermCode:
          pattern: '|[\d]{4}'
          type: string
          description: Client-defined code representing the ticket terms under which
            the promotional purchase was processed, Length 4.
          example: ''
        departmentCodes:
          type: array
          description: Client-defined code representing the department where the customer
            made a purchase, Length 90.
          items:
            type: string
        cardId:
          pattern: '|[\w\s\W]{1,5}'
          type: string
          description: Identifier of the card associated with the account identifier,
            Length 5.
          example: ''
        tranId:
          pattern: '|[\w\s\W]{1,15}'
          type: string
          description: "Visa\xAE or First Data\xAE-assigned identifier of the transaction\
            \ during a chargeback, retrieval, or fraud advice transaction, Length\
            \ 15."
          example: "EI)cprDG\"\f"
        extraCardTypeId:
          pattern: '|[\w\s\W]{1,15}'
          type: string
          description: Client-defined identifier of the card type, Length 5.
          example: ''
        bypassCode:
          pattern: '[B ]'
          type: string
          description: "Code determining whether the transaction adjustment or reversal\
            \ is eligible to bypass \nthe supervisor review queuing feature of the\
            \ JRQ, Adjustment Review Queue Display Transaction\nValid codes in comments.\n\
            .#### Example Values: \n  B - Do not queue the adjustment or reversal\
            \ request to the JRQ transaction. \n  blank - If the adjustment or reversal\
            \ request exceeds the amount established for an operator,           or\
            \ a value is entered in either the merchant description or merchant description\
            \ override fields,           automatically send the transaction to a supervisor\
            \ to review \n"
          example: ' '
