            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResult'
      deprecated: false
      x-proxy-name: addDualAdjustment
      x-region:
      - North America
      x-display: Adjustments
      x-codegen-request-body-name: body
      x-group-name: Transaction Processing
      x-child-product-name: Operations & Execution
  /adjustments/v2/addEnhancedBatchAdjustment:
    post:
      tags:
      - Adjustments
      summary: ADJUSTMENT_BATCH_ENHANCED_ADD ODS RPC
      description: "The ADJUSTMENT_BATCH_ENHANCED_ADD RPC will model the existing\
        \ ADJUSTMENT_BATCH_ADD RPC but will have 2 additional reserved parameters.\
        \ This transaction provides the ability to enter and release the batch header\
        \ \nas well as the associated detail item records with one request. This function\
        \ emulates the combined functionality of the JL, JB, JDE, and the JR transactions.\n\
        The ADJUSTMENT_BATCH_ENHANCED_ADD syntax consists of two sections. The Header\
        \ section begins with the \"BATCH TYPE\" parameter and ends with the \"DETAIL\
        \ COUNT\" parameter.\nThe Detail section consists of the remaining parameters\
        \ beginning with the \"DETAIL ACCOUNT\" parameter. When supplying multiple\
        \ details, the Header section is supplied once, followed by the Detail section\
        \ of each individual detail.\nRequired Fields: batchType, batchNumber, systemIdentifier,\
        \ batchAmount, letterIdentifier, detailCount,detailAccount, detailTransactionCode,\
        \ detailMerchantAccountIdentifier, detailAmount1. "
      operationId: addEnhancedBatchAdjustment_v2_adjustments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEnhancedBatchAdjustmentRequest'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResult'
      deprecated: false
      x-proxy-name: addEnhancedBatchAdjustment
      x-region:
      - North America
      x-display: Adjustments
      x-codegen-request-body-name: body
      x-group-name: Adjustments
  /adjustments/v2/amexChargeBackOutgoing:
    post:
      tags:
