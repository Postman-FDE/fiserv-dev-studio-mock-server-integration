      description: "The AMEX_CB_OUTGOING_MANUAL function creates an outgoing chargeback\
        \ for American Express\xAE accounts on the First Data\xAE System. When this\
        \ RPC is issued with the correct syntax, a one records processed message will\
        \ be received.\nRequired Fields: messageReasonCode, chargebackTypeCode, documentationIndicatorCode,\
        \ acquirerReferenceIdentifier, americanExpressTransactionIdentifier, transactionMonetaryTypeCode,\
        \ americanExpressProcessingCode, americanExpressFunctionCode, merchantCategoryCode,\
        \ americanExpressIssuerInstitutionIdentifier, americanExpressIssuerProcessingInstitutionIdentifier,\
        \ postDate, americanExpressAcquirerInstitutionIdentifier, americanExpressAcquirerProcessingInstitutionIdentifier,\
        \ transactionDate, issuerCurrencyCode, processDate, processTime, issuerAmount,\
        \ chargebackAmount, chargebackAmountCurrencyCode, chargebackAmountExponentCount,\
        \ interchangeAmount, interchangeAmountCurrencyCode, interchangeAmountExponentCount,\
        \ interchangeAmountConversionRate, transactionAmount, transactionAmountCurrencyCode,\
        \ transactionAmountExponentCount, merchantTerminalIdentifier, americanExpressMerchantAccountIdentifier,\
        \ transactionReferenceIdentifier.<br><br> <b>Relates to:</b>\n  \n  <blockquote\
        \ style=\"border-left: 0.375em solid #40a9ff; background-color: #e6f7ff; border-radius:\
        \ 3px; padding: 1em;\" ><div>AMEX_CB_OUTGOING_MANUAL RPC, <a target=\"_blank\"\
        \ title=\"Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: amexChargeBackOutgoing_v2_adjustments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmericanExpressChargeBackOutgoingRequest'
        required: false
      responses:
