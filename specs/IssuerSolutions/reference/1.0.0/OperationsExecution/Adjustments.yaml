- url: https://qa-api.firstdata.com/fs
paths:
  /adjustments/v2/addBatchAdjustment:
    post:
      tags:
      - Adjustments
      - Transaction Processing
      - Operations & Execution
      summary: ADJUSTMENT_BATCH_ADD RPC
      description: "The ADJUSTMENT_BATCH_ADD function enters and releases the batch\
        \ header as well as the associated detail item records with one request. This\
        \ function emulates the combined functionality of the JL, JB, JDE, and the\
        \ JR transactions.\nThe ADJUSTMENT_BATCH_ADD syntax consists of two sections.\
        \ The Header section begins with the \"BATCH TYPE\" parameter and ends with\
        \ the \"DETAIL COUNT\" parameter.\nThe Detail section consists of the remaining\
        \ parameters beginning with the \"DETAIL ACCOUNT\" parameter. When supplying\
        \ multiple details, the Header section is supplied once, followed by the Detail\
        \ section of each individual detail.\n\nRequired Fields: batchType, batchNumber,\
        \ systemIdentifier, batchAmount, letterIdentifier, detailCount,detailAccount,\
        \ detailTransactionCode, detailMerchantAccountIdentifier, detailAmount1. <br><br>\
        \ <b>Relates to:</b>\n  \n  <blockquote style=\"border-left: 0.375em solid\
        \ #40a9ff; background-color: #e6f7ff; border-radius: 3px; padding: 1em;\"\
        \ ><div>ADJUSTMENT_BATCH_ADD RPC, <a target=\"_blank\" title=\"Click to open\
        \ in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: addBatchAdjustment_v2_adjustments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentBatchAddRequest'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResult'
      deprecated: false
      x-proxy-name: addBatchAdjustment
      x-region:
      - North America
      x-display: Adjustments
      x-codegen-request-body-name: body
      x-group-name: Transaction Processing
      x-child-product-name: Operations & Execution
  /adjustments/v2/addDualAdjustment:
    post:
      tags:
      - Adjustments
      - Transaction Processing
      - Operations & Execution
      summary: DUAL_ADJUSTMENT_ADD RPC
      description: "The Dual Adjustment Add RPC is a quick way to modify all transactions\
        \ with same prefixes and transaction codes.\n\nRequired Fields: common.accountId,\
        \ batchPrefixIdentifier, transactionCode, transactionAmount<br><br> <b>Relates\
        \ to:</b>\n  \n  <blockquote style=\"border-left: 0.375em solid #40a9ff; background-color:\
        \ #e6f7ff; border-radius: 3px; padding: 1em;\" ><div>DUAL_ADJUSTMENT_ADD RPC,\
        \ <a target=\"_blank\" title=\"Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: addDualAdjustment_v2_adjustments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DualAdjustmentAddRequest'
        required: false
      responses:
