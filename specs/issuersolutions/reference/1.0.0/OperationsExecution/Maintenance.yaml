    FraudSuspendStrategyRequest:
      required:
      - fraudSuspendStrategyDate
      - fraudSuspendStrategyIdentifier
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        fraudSuspendStrategyIdentifier:
          type: string
          description: 'Code representing whether you want to restrict this account
            from fraud authorization decision processing or send this account to a
            new strategy until the date specified in the fraudSuspendStrategyDate
            field. This is a required field. Enter 98 to suspend fraud authorization
            decision processing until the day set in the fraudSuspendStrategyDate
            field. Enter any number from 01 through 97 to apply a client-defined fraud
            strategy code to this account until the date specified in the fraudSuspendStrategyEndDate
            field. If you do not set this field, the System sets it to zeros, indicating
            that fraud authorization decision processing does not apply. If you enter
            a strategy identifier of 01 through 97, the System queries either the
            FDR Falcon Strategy System or the First Data DefenseEdge service of Rules
            Management for a valid production fraud strategy based on your Product
            Control File settings indicating which product you use for fraud authorization
            decision processing. When entering the NM*238 transaction online, the
            System responds with an error message if the fraud strategy you enter
            does not exist in production status. If the NM*238 transaction is submitted
            via batch processing and the System does not find the fraud strategy,
            the transaction fails to post and subsequently appears on the CD-011,
            Non-Monetary Entry List report. Be aware that a new fraud strategy group
            scheduled to be promoted to production status during nightly batch processing
            will not be available for use until approximately 12:00 A.M. central time.
            Any NM*238 transactions attempted prior to this time will be rejected.
            However, if the new fraud strategy group is promoted to production status
            real-time, it will be available immediately to the System for validating
            a fraud strategy submitted via online or batch NM*238 transactions. '
        fraudSuspendStrategyDate:
          type: string
          description: 'Date you want the System to remove the restriction or special
            strategy processing. ODS Default Format is MMDDYY. This is a required
            field. The System returns to normal fraud authorization decision processing
            during nightly processing on the date you enter in this field. For example,
            if you set this field to 12/21, the System begins using the value indicated
            in the FRAUD ASSIGNED STRATEGY field on the NM CR, Account Credit Processing
            screen, during nightly processing for 12/21. '
        fraudStrategySuspenseStartDate:
          type: string
          description: "Date you want the System to begin the suspension of normal\
            \ fraud authorization decision processing or send this account to a new\
            \ strategy until the date specified in the fraudSuspendStrategyDate field.\
            \ This is an optional field. ODS Default Format is MMDDYY. If you do not\
            \ enter a start date, the System uses the current processing date as the\
            \ start date. If you enter a future date, be aware the fraud suspend strategy\
            \ you enter doesn\uFFFDt become effective until after nightly processing\
            \ completes following the date you enter in this field. For example, if\
            \ the current date is 10/2 and you set this field to 10/3, the fraud suspend\
            \ strategy doesn\uFFFDt become effective until nightly processing completes\
            \ on 10/3. In addition, if the future start date is a non-processing day,\
            \ the fraud suspend strategy doesn\uFFFDt become effective until after\
            \ nightly processing completes on the processing day following the non-processing\
            \ day. "
