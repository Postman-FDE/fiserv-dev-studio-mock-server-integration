  /maintenance/v2/transactionMatchingAdd:
    post:
      tags:
      - Maintenance
      - Servicing
      - Operations & Execution
      - NM
      - Non-Mon
      - Non-Monetary
      - Non-Monetaries
      - Nonmon
      - Nonmons
      summary: NM*791*90
      description: "Request requires Account Id, Monetary Transaction Code, Transaction\
        \ Amount, Transaction Date, Card Acceptor/Merchant Identifier, Flap Identifier,\
        \ and Promo Code Identifier. A new cardholder nonmon, transaction code 791,\
        \ subtran code 90 will be available to add transaction match data entries\
        \ to a cardholder account. The new nonmon can be initiated via the ODS RPC\
        \ CNONMON, batch entry, or via web services. To use the new data for sales\
        \ and cash advances, a new DMM decision element, TRAN MATCH ID, will be added\
        \ to Transaction Level Processing. Use of the new element will initiate the\
        \ process to match the new transaction match cardholder data to the monetary\
        \ transaction. The process will look through the transaction match entries\
        \ for the cardholder and check for a match to the sale or cash advance being\
        \ posted. It will match on tran code, tran amount, and tran date. If there\
        \ is a match on those three fields, it will determine if there is a merchant\
        \ number or MCC code on the matched entry, and compare to the appropriate\
        \ transaction field. If a match is found, the system will return the TLP match\
        \ text as the decision element value for the new element. If no match is found\
        \ for the merchant number/MCC code, the system will continue checking account\
        \ entries. If no match is found on any entries for this account, TLP will\
        \ process with spaces as the decision element value. When processing returns\
        \ for accounts with transaction match data on file, the system will match\
        \ on tran code, tran amount, tran date. The match on the merchant number or\
        \ MCC code entered will be done in the same manner as described for the TLP\
        \ element. When a match is found, the return will be posted to the FLAP balance\
        \ ID from the table entry. Once a monetary transaction is matched to an entry\
        \ in the new cardholder transaction match record, the matched date will be\
        \ set and the entry is no longer eligible to be matched to monetary transactions.\
        \ When cardholder accounts are combined, the entries from both accounts will\
        \ be combined. If the total entries is more than 20, the oldest entry (or\
        \ entries) will be removed.<br><br> <b>Relates to:</b>\n  \n  <blockquote\
        \ style=\"border-left: 0.375em solid #40a9ff; background-color: #e6f7ff; border-radius:\
        \ 3px; padding: 1em;\" ><div>CNONMON 791*90 RPC, <a target=\"_blank\" title=\"\
        Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: transactionMatchingAdd_v2_maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionMatchingAddRequest'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMaintUpdateResult'
      deprecated: false
      x-proxy-name: transactionMatchingAdd
      x-region:
      - North America
      x-display: Maintenance
      x-codegen-request-body-name: body
      x-group-name: Servicing
      x-child-product-name: Operations & Execution
