    BulkShippingAddressAddRequest:
      required:
      - addressFormatCode
      - addressLineOne
      - agentIdentifier
      - bulkIdentifier
      - companyIdentifier
      - companyName
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        agentIdentifier:
          pattern: \d{4}
          type: string
          description: Identifier of the hierarchical levels of system, principal,
            and agents used to group accounts for a client.
          example: '3114'
        companyIdentifier:
          pattern: '[a-zA-Z0-9]{1,8}'
          type: string
          description: Client-defined identifier of the company.
          example: 67JlLU17
        bulkIdentifier:
          pattern: '[a-zA-Z0-9]{1,12}'
          type: string
          description: Client-defined identifier of the commercial card bulk shipping
            address for the company.
          example: Ma2asD
        addressFormatCode:
          pattern: '[FU]'
          type: string
          description: 'Code determining whether to perform city, state, and zip code
            edits on the commercial card bulk shipping address. Valid codes: F - Formatted
            (perform the edits on the address), U - Unformatted (do not perform the
            edits on the address). Note: If you enter F in this field, do not enter
            information in the Address Line Three field.'
          example: F
        companyName:
          pattern: '[A-Z0-9&,/''-. ]{1,26}'
          type: string
          description: "Company name used for the bulk shipping address. The International\
            \ Organization for Standardization (ISO) specifications recommend that\
            \ you avoid using special characters such as apostrophes and commas when\
            \ entering data for magnetic stripe and chip personalization. While First\
            \ Data recommends that you follow ISO recommendations, the First Data\uFFFD\
            \ System does not edit for or restrict entry of the following special\
            \ characters: & Ampersand, \uFFFD Apostrophe, , Comma, - Hyphen (minus\
            \ symbol), / Forward slash, . Period. Be aware that inclusion of these\
            \ characters in magnetic stripe or chip personalization data may result\
            \ in account holds for formatting reasons. To avoid such holds, use only\
            \ upper case letters A-Z and numbers 0-9. Lower case letters a-z and all\
            \ other characters and symbols are not valid. They are reserved for use\
            \ as processing controls."
          example: T/W8  9) PTT,X
        addressAttentionLine:
          pattern: '[A-Z0-9&,/''-. ]{0,26}'
          type: string
          description: Name of the person or department to receive a shipment of the
            commercial cards associated with the bulk shipping address. Use only the
            characters and symbols that appear on the table in the description of
            the Company Name field to enter information in this field.
          example: '''S2'
        addressLineOne:
          pattern: '[A-Z0-9&,/''-. ]{1,30}'
          type: string
          description: Text describing the first line of the bulk shipping address.
            If you have the urbanization name for a Puerto Rican address, enter it
            in this field and enter the street address in the Address Line Two field.
            Under other circumstances, enter the street address in this field. Use
            only the characters and symbols that appear on the table in the description
            of the Company Name field to enter information in this field.
          example: 7IR45ZL.Z96&HC&4&
        addressLineTwo:
          pattern: '[A-Z0-9&,/''-. ]{0,30}'
          type: string
          description: Text describing the second line of the bulk shipping address.
            Use only the characters and symbols that appear on the table in the description
            of the Company Name field to enter information in this field.
          example: 17TS
        addressLineThree:
          pattern: '[A-Z0-9&,/''-. ]{0,30}'
          type: string
          description: Text describing the third line of the bulk shipping address.
            Enter information in this field only if you set the Address Format Code
            field to U. Use only the characters and symbols that appear on the table
            in the description of the Company Name field to enter information in this
            field.
          example: 1Z4,6VQRVJ232V,IV/
        cityName:
          pattern: '[A-Z0-9&,/''-. ]{0,25}'
          type: string
          description: Name of the city for the bulk shipping address. If you enter
            F in the Address Format Code field, this field is required. If you enter
            U in the Address Format Code field, do not use this field Use only the
            characters and symbols that appear on the table in the description of
            the Company Name field to enter information in this field.
          example: H*
        addressSubdivision:
          pattern: '[A-Z0-9&,/''-. ]{0,25}'
          type: string
          description: Text describing the country subdivision of the bulk shipping
            address Information that you can enter in this field includes a state
            abbreviation, province code, or island name. If you enter F in the Address
            Format Code field, this field is required. If you enter U in the Address
            Format Code field, do not use this field. Use only the characters and
            symbols that appear on the table in the description of the Company Name
            field to enter information in this field.
          example: '&'''
        postalCode:
          maxLength: 10
          minLength: 0
          type: string
          description: Zip code or postal code of the bulk shipping address. If you
            enter F in the Address Format Code field, this field is required. If you
            enter U in the Address Format Code field, do not use this field.
          example: VFn0oT286Z
        countryCode:
          maxLength: 3
          minLength: 0
          type: string
          description: Code representing the country of the bulk shipping address.
            If you enter F in the Address Format Code field, this field is required.
            If you enter U in the Address Format Code field, do not use this field.
            If you enter a value in this field, the System edits it for a valid code
            related to a country supported by First Data. If you enter information
            in this field, the System edits it for a three-position International
            Organization for Standardization (ISO) alpha code for a First Data-supported
            country. If you leave this field blank, the System does not edit it.
          example: PI6
        contactPhone:
          maxLength: 19
          minLength: 0
          type: string
          description: Telephone number of the company contact for the bulk shipping
            address. The required length and characters for the telephone number in
            this field is determined by your setting in the Expansion Phone Code parameter
            in the Address Name Phone section (PF PC AN) of the Product Control File
            (PCF). If the parameter is set to zero, the System edits this field for
            a 10-position numeric number. If the parameter is set to 1, the System
            does not edit this field, which can contain a phone number with numeric
            and alpha characters up to 19 positions in length.
          example: 4b7bQqzBgL9lAVzCZjA
