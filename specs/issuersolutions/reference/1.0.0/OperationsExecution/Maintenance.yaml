            contact) chip card

            07 - Mobile device

            08 - Europay Mastercard Visa (EMV) Contact Only chip card

            16 - Virtual/digital ID'
          example: ZN
        customerRoleCode:
          maxLength: 2
          minLength: 1
          type: string
          description: 'Code representing the role the customer plays on the account. '
          example: U9
        memberSequenceIdentifier:
          maxLength: 5
