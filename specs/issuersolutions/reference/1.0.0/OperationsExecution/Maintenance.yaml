          description: 'Sequence number of the detail item to be processed. The data
            for this parameter is returned by the DTL_SEQ_NUM2 field of the DTL, CYCLDTL,
            CURRDTL, PASTDTL, and PREVDTL views. '
          example: '751'
        statementDate:
          type: string
          description: 'Statement date for the requested detail item. For cycle-to-date
            items enter 99999999. For current statement details, enter the statement
            date returned by the CURRDTL view. If that date is zeros, enter zeros.
            This parameter is required if the "detail item sequence number" parameter
            is entered. Ods Format: YYYYMMDD'
