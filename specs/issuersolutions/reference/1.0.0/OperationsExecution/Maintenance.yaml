      summary: NM*795*15
      description: "Use the NM*795*15, Duplicate Correspondence Code for Statements\
        \ transaction, to produce a duplicate statement for the secondary customer\
        \ in addition to the statement for the account's principal customer. You can\
        \ set the Invalid Addr Routing Cd/Stmt parameter in the Statement Production\
        \ section (CP IC SP) of the Product Control File (PCF) to determine whether\
        \ and to where the System mails statements when the secondary customer address\
        \ is invalid. You can also enter this information using the STMT field of\
        \ the NM CSR, Account Customer Service Request transaction. If you use this\
        \ option, you can produce a statement copy in one of the following languages.\
        \ American English, Canadian French, Latin American Spanish. The text THIS\
        \ IS A COPY will be overlaid in the applicable language on all pages of the\
        \ duplicate statement and on any checks or coupons, which are invalid. All\
        \ inserts for the principal customer's statement are included with the duplicate\
        \ statement for the secondary customer, who may not be eligible for all offers\
        \ in the mailing package. The System uses the statement hold code to prevent\
        \ statements from being sent to the principal cardholder when a loan or credit\
        \ card account has an external status of B (bankrupt). However, depending\
        \ on settings in the Suppress Dup Correspondence parameter in the Statement\
        \ Production section (CP IC SP)) of the Production Control File, the System\
        \ may send duplicate statements to the secondary cardholder if the secondary\
        \ cardholder has not yet filed for bankruptcy protection. If no secondary\
        \ customer address exists on the Cardholder Master File, the duplicate statement\
        \ will be mailed to the principal customer's address. The process for determining\
        \ the mailing address applies to Universal Addressing and non-Universal Addressing\
        \ clients. If you do not use Universal Addressing and want to send the secondary\
        \ customer's duplicate statement to an address that differs from the address\
        \ of the principal customer, you must take the following actions. Set the\
        \ Alt Address Indicator parameter in the Address Name Phone Controls section\
        \ (PF PC AN) of the Product Control File to Y, Enter a billing (BLL1) or statement\
        \ (STMT) address for the secondary customer using the NM EA, Account Expanded\
        \ Address Maintenance transaction. Required Fields: common.accountId and duplicateCorrespondenceCode.\
        \ <br><br> <b>Relates to:</b>\n  \n  <blockquote style=\"border-left: 0.375em\
        \ solid #40a9ff; background-color: #e6f7ff; border-radius: 3px; padding: 1em;\"\
        \ ><div>CNONMON 795*15 RPC, <a target=\"_blank\" title=\"Click to open in\
        \ a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
