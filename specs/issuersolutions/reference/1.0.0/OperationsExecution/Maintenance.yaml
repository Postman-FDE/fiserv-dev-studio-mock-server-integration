    MasterCardExceptionAddRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        inasReasonCode:
          type: string
          description: 'Code representing the reason the account is being placed on
            the INAS authorization and exception files. Valid Codes: C - Credit, F
            - Fraud, G - Gold card, Code G identifies the account as having a gold
            card, that is authorized according to the limits that, Mastercard has
            established., L - Lost, O - Other, P - Pick up card, S - Stolen, U - Unauthorized
            use, V - VIP status (Code V identifies the account as having a gold card
            that, is authorized only if the amount of the authorization is, below
            the amount you enter in the LIMIT field), X - Counterfeit'
        authorizationLimitAmount:
          type: string
          description: 'Amount of the authorization limit; variable length, 13-position,
            optional parameter, edited for numeric values. This field is valid only
            if you enter V in the INAS Reason Code field. If you do not enter V in
            the reason code field, the System uses the amount set in the INAS Auth
            Limit parameter in the Industry Products section (PF PC IP) of the Product
            Control File. If this parameter is not set to a value, the System uses
            $1500. If a value is entered in the authorization limit field, it must
            be greater than or equal to the value in the INAS Auth Limit parameter.
            The authorization limit field can be obtained through Open Data Streams
            by using the PCF view to select the VBS_VIP_AMT field. '
    MasterCardExceptionAddResponse:
      type: object
