    PresentationInstrumentUpdateRequest:
      required:
      - presentationInstrumentIdentifier
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        presentationInstrumentIdentifier:
          maxLength: 19
          minLength: 13
          type: string
          description: 'Identifier of the customer''s presentation instrument. Required
            parameter.

            Variable length, 19-position, edited for a valid presentation instrument
            identifier.

            '
          example: nh9baKgV7CCBLfInkZd
        memberSequenceIdentifier:
          maxLength: 5
          minLength: 1
          type: string
          description: 'System-generated sequence identifier representing a specific
            customer on the account. Required parameter.

            Variable-length, 5-position, edited for numeric values.

            '
          example: QcieY
        plasticCount:
          maxLength: 3
          minLength: 1
          type: string
          description: 'Count of presentation instruments that will be issued for
            the customer role.

            Variable-length, 3-position, edited for numeric values.

            '
          example: 2xz
        plasticTypeCode:
          maxLength: 1
          minLength: 1
          pattern: '[0-9]'
          type: string
          description: 'Code determining the type of plastic to be issued to this
            customer.

            Valid codes:

            0 - Do not emboss plastics for this customer on this account.

            1 - Use the parameters in the Plastic Products strategy for plastic type
            1 to emboss plastics on this account.

            2 - Use the parameters in the Plastic Products strategy for plastic type
            2 to emboss plastics on this account.

            3 - Use the parameters in the Plastic Products strategy for plastic type
            3 to emboss plastics on this account.

            4 - Use the parameters in the Plastic Products strategy for plastic type
            4 to emboss plastics on this account.

            5 - Use the parameters in the Plastic Products strategy for plastic type
            5 to emboss plastics on this account.

            6 - Do not emboss plastics or create embossing records for this account.
            This value is for special use when you set the Embossing Services Option
            parameter in the Embossing Processing section (AO AC EM) of the Product
            Control File to N.

            7 - Do not emboss plastics or create embossing records for this account.
            This value is for special use when you set the Embossing Services Option
            parameter in the Embossing Processing section (AO AC EM) of the Product
            Control File to N.

            8 - Use the parameters in the Plastic Products strategy for plastic type
            8 to emboss plastics on this account.

            9 - Use the parameters in the Plastic Products strategy for plastic type
            5 to emboss plastics on this account.

            '
          example: '2'
        piStatusCode:
          type: string
          description: 'Code representing the external status of the presentation
            instrument.

            Valid codes:

            A - This presentation instrument identifier is blocked from authorization
            approval.

            C - This presentation instrument identifier is closed. This status will
            prevent authorization approval but will not prevent any other monetary
            or non-monetary transactions from being posted.

            L - This presentation instrument identifier is associated with a lost
            presentation instrument. This valid code is system-generated only.

            U - Fraud has been detected on this presentation instrument identifier.
            This valid code is system-generated only.

            X - This presentation instrument identifier is associated with an account
            that has been flagged for deletion. All presentation of this presentation
            instrument identifier will be suppressed. A presentation instrument identifier
            with this status will be removed from the presentation instrument database
            when the associated account is deleted from the Cardholder Master File
            during month-end account deletion processing. This valid code is system-generated
            only.

            blank - This presentation instrument identifier is associated with an
            active presentation instrument.

            '
        piStatusReasonCode:
          maxLength: 2
          minLength: 2
          type: string
          description: 'Client-defined identifier of the reasons for the external
            status of the presentation instrument identifier.

            Fixed-length, 2-position, edited for numeric values.

            '
          example: cn
        activationCode:
          maxLength: 1
          minLength: 1
          pattern: '[0178]'
          type: string
          description: 'System-generated code representing whether this presentation
            instrument identifier has been activated.

            Valid codes:

            0 - No card activation status.

            1 - Never block for card activation.

            7 - Positive cardholder identification and/or verification of plastic
            receipt has not yet been established for this new plastic or plastic issued
            for a reason other than reissue.

            8 - Positive cardholder identification and/or verification of plastic
            receipt has not yet been established for this reissued plastic.

            '
          example: '8'
        pinProhibitIndicator:
          maxLength: 1
          minLength: 1
          pattern: '[YN]'
          type: string
          description: 'Indicator designating whether PIN processing is denied for
            this presentation instrument identifier.

            Valid values:

            N - No, this presentation instrument identifier is not prohibited from
            PIN processing.

            Y - Yes, this presentation instrument identifier is prohibited from PIN
            processing.

            '
          example: N
        piSecurityCode:
          maxLength: 6
          minLength: 6
          type: string
          description: "Identifier of the presentation instrument security code.\n\
            Fixed-length, 6-position, edited for numeric values.\nThis entry changes\
            \ or deletes a presentation instrument identifier\uFFFDs security code.\
            \ For dual accounts, this entry changes or deletes the security code on\
            \ the drive-side plastic. Changing the security code may also cause automatic\
            \ purging of incorrect reissue plastics and force embossing of new plastics\
            \ depending on your Product Control File settings. The System issues an\
            \ incorrect plastic if you change the security code after the production\
            \ of the embossing reissue tape. This occurs 30 or 60 days before the\
            \ cardholder plastics expire. To use the automatic purge and force emboss\
            \ options in the Embossing Processing section (AO AC EM) of the Product\
            \ Control File, set the Purge/Reinstatement Option parameter to zero,\
            \ 1, 2, 3, or 4 and the Security Code Purge Option parameter to 1.\n"
          example: RgRTB9
        pinVerificationCode:
          maxLength: 5
          minLength: 5
          type: string
          description: 'PIN verification identifier for the presentation instrument.

            Fixed-length, 5-position, edited for numeric values.

            If you are a single entity or multiple like processor, and you enter this
            value for the principal customer role, the system will automatically apply
            this value to the presentation instruments for all additional names on
            the account. The system will set this same value for the secondary presentation
            instrument as well, unless you set the Pin Generator Second Card parameter
            in the PIN Controls section (PF EC PN) of the Product Control File to
            1 or 2.

            '
          example: fTyRD
        lastPlasticGenerationDate:
          type: string
          description: 'Date that a presentation instrument was last issued for this
            presentation instrument identifier.

            Fixed-length, 10-position format: YYYY-MM-DD, edited for numeric values.

            '
        personalizedEmbossingText:
          maxLength: 26
          minLength: 1
          type: string
          description: 'Free form text to be embossed on the plastic for the customer
            role associated with this presentation instrument identifier.

            Variable-length, 26-position, edited for valid embossing characters.

            '
          example: leOLvHiizsULq5LOwt8W0PeG96
        smartCardSuiteIdentifier:
          maxLength: 8
          minLength: 8
          type: string
          description: 'Reserved for restricted use.

            '
          example: bFNvIRXk
        piBulkMailIdentifier:
          maxLength: 12
          minLength: 1
          type: string
          description: "Client-defined identifier of the address to which plastics\
            \ are to be shipped in bulk.\nVariable-length, 12-position, edited for\
            \ a valid Bulk Mail Identifier or the value ACCOUNT.\nIf you enter ACCOUNT\
            \ in this parameter, plastics from a product request with the same presentation\
            \ instrument identifier will be shipped in bulk directly to the account\uFFFD\
            s principal customer. This parameter is reserved for CIU clients whose\
            \ plastics are embossed by FDR and who use the bulk shipping option for\
            \ plastics.\n"
          example: fefCWSA9rMHg
        mobileCplcIdentifier:
          maxLength: 52
          minLength: 1
          type: string
          description: 'Identifier of the chip on a mobile payment device that stores
            the presentation instrument.

            '
          example: l
        mobileWalletIdentifier:
          maxLength: 25
          minLength: 1
          type: string
          description: 'Identifier of the electronic wallet on a mobile payment device.

            '
          example: H89AIandkaX5n4wL76inOGdkK
        mobilePresentationInstrumentNickname:
          maxLength: 20
          minLength: 1
          type: string
          description: 'Customer-defined name of the presentation instrument stored
            on a mobile payment device.

            '
          example: xUY39KTqHchw4CfehxXt
        cycleAlertPlayerIndicator:
