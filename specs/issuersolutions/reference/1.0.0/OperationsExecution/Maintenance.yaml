            an individual can perform before the transaction is denied by the chip. '
        internationalLowerConsecutiveOfflineLimitNumber:
          type: string
          description: 'Count of offline authorized international transactions (ILCOL)
            an individual can perform before the chip card automatically requests
            an online authorization via a chip-enabled terminal. '
        internationalUpperConsecutiveOfflineLimitNumber:
          type: string
          description: 'Count of offline authorized international transactions (IUCOL)
            an individual can perform before the transaciton is denied by the chip

            For example, if the transaction count exceeds the IUCOL value, and if
            the chip-enabled terminal is unable to execute an online authorization,
            the chip will deny the transaction. '
        cardholderVerificationMethodText:
          type: string
          description: 'Text describing the global method used for cardholder verification.

            The CVM field can contain a maximum of 72 characters with the following
            edits.

            The characters in the CVM field must be divisible by four, or the System
            will reject the transaction.

            **Positions 1-8** are edited for valid numeric values

            **Positions 9-16** are edited for valid numeric values

            **Positions 17-72** are edited for the valid values 0-9 and A-F only.
            However, every alternate two characters starting with the 17th character
            should have the following valid values.

            #### Valid codes for positions 17-72:

            Every alternate two characters starting with the 17th character has the
            following valid values.

            **00** - Fail CVM processing

            **01** - Plaintext offline PIN fail CVM if fail

            **02** - Online PIN fail if fail

            **03** - Plaintext offline PIN and signature fail if fail

            **04** - Enciphered offline PIN fail CVM if fail

            **05** - Enciphered offline PIN and signature fail CVM if fail

            **1E** - Signature fail CVM if fail

            **1F** - No CVM fail CVM if fail

            **41** - Plaintext offline PIN next CVM if fail

            **42** - Online PIN next CVM if fail

            **43** - Plaintext offline PIN and signature next CVM if fail

            **44** - Enciphered offline PIN next CVM if fail

            **45** - Enciphered offline PIN and signature next CVM if fail

            **5E** - Signature next CVM if fail

            **5F** - No CVM next CVM if fail

            **space** - Default value. '
        updateConsecutiveTransactionInternationalUpperLimitCode:
          type: string
          description: 'Code determining if the Consecutive Transaction International
            Upper Limit Code (CTIUL) count is locked or can be changed, for the chip
            card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
            in locked status.

            **L** - Current count is locked for the customer.

            **T** - Update this count even if it has a locked status and leave it
            in unlocked status.

            **U** - Current count can be changed.

            **blank** - Current count can be changed. '
        updateInternationalLowerConsecutiveOfflineLimitCode:
          type: string
          description: 'Code determining if the International Lower Consecutive Offline
            Limit Code (ILCOL) count is locked or can be changed, for the chip card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
            in locked status.

            **L** - Current count is locked for the customer.

            **T** - Update this count even if it has a locked status and leave it
            in unlocked status.

            **U** - Current count can be changed.

            **blank** - Current count can be changed. '
        updateInternationalUpperConsecutiveOfflineLimitCode:
          type: string
          description: 'Code determining if the International Upper Consecutive Offline
            Limit Code (IUCOL) count is locked or can be changed, for the chip card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
            in locked status.

            **L** - Current count is locked for the customer.

            **T** - Update this count even if it has a locked status and leave it
            in unlocked status.

            **U** - Current count can be changed.

            **blank** - Current count can be changed. '
        updateCardholderVerificationMethodCode:
          type: string
          description: 'Code determining if the global method CVM is locked, or can
            be changed, for the chip card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
            in locked status.

            **L** - Current count is locked for the customer.

            **T** - Update this count even if it has a locked status and leave it
            in unlocked status.

            **U** - Current count can be changed.

            **blank** - Current count can be changed. '
        singleTransactionLimitAmount:
          type: string
          description: 'Maximum amount of a single Discover Network transaction that
            can be approved offline. '
        updateSingleTransactionLimitCode:
          type: string
          description: 'Code representing whether the amount in the SNGL_TRAN_LIMT_AM
            field is locked, or can be changed, for the chip card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
            in locked status.

            **L** - Current count is locked for the customer.

            **U** - Current count can be changed.

            **blank** - Current count can be changed. '
        cardholderVerificationMethodTwoText:
          type: string
          description: 'Text describing the common AID method used for cardholder
            verification.

            The CVM field can contain a maximum of 72 characters with the following
            edits.

            The characters in the CVM field must be divisible by four, or the System
            will reject the transaction.

            **Positions 1-8** are edited for valid numeric values

            **Positions 9-16** are edited for valid numeric values

            **Positions 17-72** are edited for the valid values 0-9 and A-F only.
            However, every alternate two characters starting with the 17th character
            should have the following valid values.

            #### Valid codes for positions 17-72:

            Every alternate two characters starting with the 17th character has the
            following valid values.

            **00** - Fail CVM processing

            **01** - Plaintext offline PIN fail CVM if fail

            **02** - Online PIN fail if fail

            **03** - Plaintext offline PIN and signature fail if fail

            **04** - Enciphered offline PIN fail CVM if fail

            **05** - Enciphered offline PIN and signature fail CVM if fail

            **1E** - Signature fail CVM if fail

            **1F** - No CVM fail CVM if fail

            **41** - Plaintext offline PIN next CVM if fail

            **42** - Online PIN next CVM if fail

            **43** - Plaintext offline PIN and signature next CVM if fail

            **44** - Enciphered offline PIN next CVM if fail

            **45** - Enciphered offline PIN and signature next CVM if fail

            **5E** - Signature next CVM if fail

            **5F** - No CVM next CVM if fail

            **space** - Default value. '
        getUpdateCardholderVerificationMethodTwoCode:
          type: string
          description: 'Code determining if the common AID CVM is locked, or can be
            changed, for the chip card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
