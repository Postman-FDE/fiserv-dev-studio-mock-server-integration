  /maintenance/v2/addMcException:
    post:
      tags:
      - Maintenance
      - Servicing
      - Operations & Execution
      summary: MC_EXCEPTION_ADD RPC
      description: "The MC_EXCEPTION_ADD function adds a MasterCard account to the\
        \ INAS authorization file so that proper action can be taken when INAS cannot\
        \ reach FDR's authorization file. This function also prohibits authorizations\
        \ without listing the account on the warning bulletin, because accounts on\
        \ the INAS authorization file are automatically placed on the INAS exceptions\
        \ file. This function emulates the WMA transaction. Required Fields: common.presentationId,\
        \ inasReasonCode, authorizationLimitAmount<br><br> <b>Relates to:</b>\n  \n\
        \  <blockquote style=\"border-left: 0.375em solid #40a9ff; background-color:\
        \ #e6f7ff; border-radius: 3px; padding: 1em;\" ><div>MC_EXCEPTION_ADD RPC,\
        \ <a target=\"_blank\" title=\"Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: addMcException_v2_maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterCardExceptionAddRequest'
        required: false
      responses:
