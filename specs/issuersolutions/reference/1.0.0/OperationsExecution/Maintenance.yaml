      type: object
      properties:
        statusType:
          maxLength: 1
          minLength: 0
          type: string
          description: "Code representing whether an account\uFFFDs status will be\
            \ updated (an \uFFFDA\uFFFD) or a card\uFFFDs status will be updated (a\
            \ \uFFFDP\uFFFD)."
          example: b
        statusCode:
          maxLength: 1
          minLength: 0
          type: string
          description: Code representing the status code to be placed on the account
            (A, B, C, E, F, I, L, U, Z, blank) or on the card (A, C, L, U, X, blank).
          example: M
        statusReason:
          maxLength: 2
          minLength: 2
          type: string
          description: Client-defined identifier of the reason for the external status
            value being placed on the account or on the card.
          example: 5L
    ExternalStatusReasonCodeRequest:
      required:
      - externalStatusReasonCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        externalStatusReasonCode:
          type: string
          description: 'Issuer-defined code representing the reason for the external
            status.

            For an external status of C (closed), the following status reason codes
            indicate that the System closed the account for the listed reason.

            #### Status Reason Codes:

            **85** - Closed due to your Adaptive Control overlimit strategy

            **86** - Closed due to your Adaptive Control delinquent strategy

            **87** - Closed due to your Adaptive Control reissue strategy

            **90** - Closed due to your setting in the delinquency action code parameters
            in the Delinquency Processing section (DO DC DP) of the Product Control
            File

            **91** - An old account closed after an account transfer due to your settings
            in the Automatic Close Days After Transfer and Status Reason Code Overlay
            Switch parameters in the Account Maintenance section (AO CH AM) of the
            Product Control File

            **92** - Closed in the reissue process due to your setting in the delinquent
            and overlimit parameters in the Eligibility section (RE CR EL) of the
            Product Control File

            **93** - Closed in the reissue process due to your settings in the Reissue
            Terms parameter in the Eligibility section (RE CR EL) of the Product Control
            File and the Ratification Level parameter in the Debit Ratification section
            (AO AC DR) of the Product Control File

            **94** - Closed in the reissue process due to your settings in the Include/exclude
            States and Reissue States parameters in the Eligibility section (RE CR
            EL) of the Product Control File

            **95** - Closed in the reissue process due to an external status other
            than A or blank

            **96** - Closed in the reissue process due to your setting in the Inactive
            Option parameter in the Reissue Options section (RE OP RO) of the Product
            Control File

            **97** - Closed by consumer.

            For an external status of Z (charged off), the following status reason
            codes indicate that the charge-off is for the listed reason.

            #### Status reason codes:

            **68** - Legally paid in full for less than the full balance

            **88** - Fraud

            **89** - Bankrupt

            **99** - Abandoned. '
    ExternalStatusUpdateRequest:
      required:
      - externalStatus
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        externalStatus:
          $ref: '#/components/schemas/ExternalStatus'
    FdrUseOneFieldsRequest:
      required:
      - subtransactionCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        subtransactionCode:
          pattern: '[1-8]'
          type: string
          description: 'Subtransaction code representing the field of the FDR use
            1

            fields to change


            Valid codes:

            Y - Yes, notify First Data of a cardholder-initiated skip

            payment request.

            blank - No, do not notify First Data of a cardholder-initiated

            skip payment request.

            Valid codes:

            1 - This field is not used for credit bureau reporting2 - Credit Bureau
            Reporting Code

            Change field 2

            If you use this subtransaction to change the value in field 2 to one

            of codes A through V or Z, the System requires you to enter a

            customer role indicator, too.

            3 - Travel Insurance Basic Rate Code

            Change field 3

            4 - Insurance Supplemental Travel Rate Tier Code

            Change field 4

            5 - Credit Balance Refund Code

            Change field 5

            6 - Reissue Extension Indicator

            Change field 6

            7 - Credit Protection Origination State Code

            Change field 7

            8 - Miscellaneous FDR First Text

            Change fields 1 through 7

            If you use this subtransaction to change the value in field 2 to one

            of codes A through V or Z, the System requires you to enter a

            customer role indicator, too.'
          example: '6'
        data:
          pattern: '[ ]|(.){1,8}'
          type: string
          description: 'Information in the FDR use 1 field

            Length: variable length, eight positions

            If you enter 5, 7, or 8 (for other than field 2 and the customerRoleCode

            indicator) in the CODE field, this is an optional field.

            If you enter 2, 3, 4, 6, or 8 (for only field 2 and the customerRoleCode

            indicator) in the CODE field is required.'
          example: ' '
        customerRoleCode:
          type: string
