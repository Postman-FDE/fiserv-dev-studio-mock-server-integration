    CustomerAccountRoleUpdateRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        memberSequenceIdentifier:
          type: string
          description: 'System-generated sequence identifier representing a specific
            customer on the account. '
        customerRoleTypeCode:
          type: string
          description: 'Alphanumeric code representing the role the customer plays
            on the account. Valid codes are any 2 characters - such as 01, 02, 03.
            Customer Role Type Code should be exactly 2 characters. '
        creditBureauReportCode:
          type: string
          description: 'Code representing either a request for an action related to
            credit reporting or the consumer''s liability for the account. Each code
            produces the result described under the Using the Credit Bureau Report
            Code heading in the ANS, Account to Customers chapter of the Cardholder
            Account Maintenance manual. Valid Codes: D - Request deletion from credit
            bureau files. Q - Do not report. R - Remove. T - Terminated. X - Deceased.
            Z - Do not report. 1 - Individual. This code represents a cardholder who
            has contractual responsibility for this account and is primarily responsible
            for payment. 2 - Joint contractual liability. This code represents a customer
            and joint borrower who are both contractually liable. 3 - Authorized user.
            This code represents a customer who can use this account without joint
            responsibility for payment. 5 - Co-maker. This code represents co-signers
            without a spouse relationship. 7 - Maker. This code represents the customer
            as liable for the account, but the co-maker is liable if the maker defaults. '
        secondCustomerExternalIdentifier:
          type: string
          description: Customer External Identifier for the second customer when a
            Customer Account Role swap is performed.
        secondCustomerRoleCode:
          type: string
          description: 'Customer Role Code for the second customer when a Customer
            Account Role swap is performed. Valid codes are any 2 characters - such
            as 01, 02, 03. Customer Role Type Code should be exactly 2 characters. '
        secondMemberSequenceIdentifier:
          type: string
          description: Member Sequence Identifier for the second customer when a Customer
            Account Role swap is performed.
        secondCreditBureauReportCode:
          type: string
          description: 'Credit Bureau Report Code for the second customer when a Customer
            Account Role swap is performed. Valid Codes: D - Request deletion from
            credit bureau files. Q - Do not report. R - Remove. T - Terminated. X
            - Deceased. Z - Do not report. 1 - Individual. This code represents a
            cardholder who has contractual responsibility for this account and is
            primarily responsible for payment. 2 - Joint contractual liability. This
            code represents a customer and joint borrower who are both contractually
            liable. 3 - Authorized user. This code represents a customer who can use
            this account without joint responsibility for payment. 5 - Co-maker. This
            code represents co-signers without a spouse relationship. 7 - Maker. This
            code represents the customer as liable for the account, but the co-maker
            is liable if the maker defaults. '
        consumerInformationIndicatorCode:
          type: string
          description: 'Code representing the customer''s bankruptcy proceedings,
            skip/trace situation, personal receivership, or lease assumption. Valid
            Codes: A - Petition for Chapter 7 bankruptcy. B - Petition for Chapter
            11 bankruptcy. C - Petition for Chapter 12 bankruptcy. D - Petition for
            Chapter 13 bankruptcy. E - Discharged through bankruptcy Chapter 7. F
            - Discharged through bankruptcy Chapter 11. G - Discharged through bankruptcy
            Chapter 12. H - Discharged through bankruptcy Chapter 13. I - Chapter
            7 bankruptcy dismissed. J - Chapter 11 bankruptcy dismissed.K - Chapter
            12 bankruptcy dismissed. L - Chapter 13 bankruptcy dismissed. M - Chapter
            7 bankruptcy withdrawn. N - Chapter 11 bankruptcy withdrawn. O - Chapter
            12 bankruptcy withdrawn. P - Chapter 13 bankruptcy withdrawn. Q - Previously
            reported indicator removed for bankruptcy (A through P or Z) or personal
            receivership (1A). R - Reaffirmation of debt. S - Previously reported
            indicator removed for reaffirmation of debt (R), reaffirmation of debt
            rescinded (V), or lease assumption (2A). T - Credit grantor cannot locate
            consumer. U - Consumer now located (previously reported T indicator removed).
            V - Chapter 7 reaffirmation of debt rescinded; consumer reneges. Z - Bankruptcy
            - undesignated chapter. 1A - Personal receivership. 2A - Lease assumption. '
        secondConsumerInformationIndicatorCode:
          type: string
          description: Consumer Information Indicator Code for the second customer
            when a Customer Account Role swap is performed.
        secondaryCreditBureauScoreNumber:
          type: string
          description: 'Risk predictor score for the secondary customer. '
        secondaryCreditBureauDate:
          type: string
          description: 'Date the credit bureau information generated from the credit
            bureau. Ods Format: YYYYMMDD. '
        secondaryCreditBureauIdentifier:
          type: string
          description: 'Code representing which credit bureau provided the information.
            Valid Codes: 1 - TransUnion, 2 - Equifax, 3 - Experian, 5 - TransUnion
            Canada, 6 - Equifax Canada, 7 - Reserved for future use. '
        secondaryCreditBureauLocalIdentifier:
          type: string
          description: 'Code representing the address and telephone number of the
            credit bureau. '
        secondaryCreditBureauAttributeOneCode:
          type: string
          description: 'Code representing key Credit Bureau Attribute First Code for
            the secondary customer, which indicates the worst public record on file
            at the credit bureau. A value of 0 indicates the best rating, a value
            of 9 the worst rating, and a space indicates you are not using this field. '
        secondaryCreditBureauAttributeTwoCode:
          type: string
          description: 'Code representing key Credit Bureau Attribute Second Code
            for the secondary customer, which indicates the worst derogatory information
            on file at the credit bureau. A value of 0 indicates the best rating,
            a value of 9 the worst rating, and a space indicates you are not using
            this field. '
        secondaryCreditBureauAttributeThreeCode:
          type: string
          description: 'Code representing key Credit Bureau Attribute Third Code for
            the secondary customer, which represents the number of trade lines a cardholder
            has on file at the credit bureau. A value of 0 indicates the best rating,
            a value of 9 the worst rating, and a space indicates you are not using
            this field. Valid codes for the third position: 0 - 1-2 trade lines, 1
            - 3-5 trade lines, 2 - 6-8 trade lines, 3 - 9-11 trade lines, 4 - 12-14
            trade lines, 5 - 15-17 trade lines, 6 - 18-20 trade lines, 7 - 21-24 trade
            lines, 8 - 25-29 trade lines, 9 - 30 or more trade lines, blank - The
            number of trade lines is not used. '
        secondaryCreditBureauReasonOneCode:
          type: string
          description: 'Code determining the specific reason you want communicated
            to the cardholder to justify the credit bureau''s score for the secondary
            customer. '
        secondaryCreditBureauReasonTwoCode:
          type: string
          description: 'Code determining the specific reason you want communicated
            to the cardholder to justify the credit bureau''s score for the secondary
            customer. '
        secondaryCreditBureauReasonThreeCode:
          type: string
          description: 'Code determining the specific reason you want communicated
            to the cardholder to justify the credit bureau''s score for the secondary
            customer. '
        secondaryCreditBureauReasonFourCode:
          type: string
          description: 'Code determining the specific reason you want communicated
            to the cardholder to justify the credit bureau''s score for the secondary
            customer. '
        secondaryCreditBureauReasonFiveCode:
          type: string
          description: 'Code determining the specific reason you want communicated
            to the cardholder to justify the credit bureau''s score for the secondary
            customer. '
        secondaryCreditBureauAlertCode:
          type: string
          description: 'Credit bureau-defined code representing an alert on the secondary
            account at the credit bureau. '
        creditBureauScore2TypeCode:
          pattern: ^[123]$
          type: string
          description: 'Second Credit Bureau Score Type Code indicates the source
            of the score:

            1 - FICO, 2 - Vantage, 3 - EDS Score, Length: 1 character. '
          example: '2'
        creditBureauScore2VersionIdentifier:
          pattern: '00[1-5]'
          type: string
          description: 'Second Credit Bureau Score Version indicates the specific
            instance of the score... '
          example: '004'
