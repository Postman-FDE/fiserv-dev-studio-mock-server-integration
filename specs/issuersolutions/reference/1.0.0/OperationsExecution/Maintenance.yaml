    ClearDelinquencyRequest:
      required:
      - customerServiceDelinquencyAdjustmentIndicator
      - lastStatementAmount
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        lastStatementAmount:
          pattern: \d{1,15}\.\d{2}
          type: string
          description: Historical last statement balance. This amount is the ending
            balance as it appeared on the last statement of the customer and does
            not reflect cross-cycle adjustments. Maximum length cannot exceed 18 digits
            including decimal.
          example: '143458330.40'
        customerServiceDelinquencyAdjustmentIndicator:
          pattern: '[nNyY]'
          type: string
          description: Indicator designating whether this is a customer service delinquency
            adjustment. Expected value 'N' or 'Y'. N - No, this is not a customer
            service delinquency adjustment; reage the account and update the reage
            dates and counters. Y - Yes, this is a customer service delinquency adjustment;
            clear the account delinquency, but do not update the reage dates and counters.
          example: n
    ClearDelinquencyRetainHistoryRequest:
      required:
      - subTran
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        subTran:
          pattern: '00|03|04|05|06|07|50|53|54|60|61|62|63'
          type: string
          description: 'SUBTRAN - Subtransaction code

            Note

            To have the System track the reage processing of accounts on

            forbearance plans, you must set the Forbearance Curing

            Control parameter in the Account Reaging section.

            Valid codes:

            00 - Clear the account delinquency and retain delinquency history. Reage

            the account if the value in the CODE field is N. Perform a customer

            service delinquency adjustment but do not reage the account if the

            value in the CODE field is Y.

            03 - Reage Last Date

            Update the last reage date with the value in the DATE field.

            04 - Reage Previous Date

            Update the previous reage date with the value in the DATE field.

            05 - Reage Prior Date

            Update the prior reage date with the value in the DATE field

            06 - Workout Last Date

            Update the last workout reage date with the value in the DATE field.

            07 - Workout Previous Date

            Update the previous workout reage date with the value in the DATE

            field.

            50 - Update the workout plan end date with the value in the DATE field,

            update the workout plan type with the value in the TYPE field.

            53 - Update the forbearance plan identifier with the value in the PLAN

            field and/or the forbearance plan start date with the value in the

            DATE field54 - Update the forbearance plan end date with the value in
            the DATE

            field

            60 - Clear account delinquency as a correction rehab and retain history
            by

            entering the last statement balance in the AMOUNT field

            61 - Clear account delinquency as a courtesy rehab and retain history
            by

            entering the last statement balance in the AMOUNT field

            62 - Clear account delinquency as a correction rehab and update history

            by entering the last statement balance in the AMOUNT field

            63 - Clear account delinquency as a courtesy rehab and update history
            by

            entering the last statement balance in the AMOUNT field'
          example: '06'
        amount:
          pattern: \d{1,15}\.\d{2}
          type: string
          description: "Last statement balance\nFormat: $$$$$$$$$$$$$$$.\uFFFD\uFFFD\
            \nLength: variable length, 17 positions\nEdits: edited for numeric values\n\
            This is a required field if SUBTRAN field is 00, 60, 61, 62, or 63"
          example: '612345.70'
        code:
          pattern: '[YN]'
          type: string
          description: 'Indicator designating whether this is a customer service

            delinquency adjustment

            Valid codes:

            N - No, this is not a customer service delinquency adjustment; reage

            the account and update the reage dates and counters.

            Y - Yes, this is a customer service delinquency adjustment; clear the

            account delinquency, but do not update the reage dates and

            counters.

            This is a required field if SUBTRAN is 00.

            '
          example: N
        date:
          type: string
          description: "If SUBTRAN field is 03, 04, 05, 06, or 07, date to replace\
            \ the last,\nprevious, or prior reage date, or the last or previous workout\
            \ reage date\nFormat: YYYYMMDD\nLength: fixed length, eight positions\n\
            Edits: edited for valid dates not greater than today\uFFFDs date\nThis\
            \ is a required field if SUBTRAN field is 03, 04, 05, 06, or 07.\nIf SUBTRAN\
            \ field is 50, date to replace the workout plan end date; if\nSUBTRAN\
            \ field is 53, date to replace the forbearance plan start date; if\nSUBTRAN\
            \ field is 54, date to replace the forbearance plan end date\nFormat:\
            \ YYYYMMDD\nLength: fixed length, eight positions\nEdits: edited for zeros\
            \ or for valid dates greater than today\uFFFDs date"
        type:
          maxLength: 2
          minLength: 0
          type: string
          description: 'If SUBTRAN field is 50, client-defined code to replace workout
            plan

            type code

            Length: two positions'
          example: 7c
        plan:
          maxLength: 2
          minLength: 0
          type: string
          description: 'If SUBTRAN field is 53, client-defined code to replace forbearance

            plan type code

            Length: two positions'
          example: SM
