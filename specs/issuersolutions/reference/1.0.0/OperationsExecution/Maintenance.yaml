    UpdateAttorneyPhoneRequest:
      required:
      - customerType
      - phoneNumber
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        customerType:
          type: string
          description: "Code determining whether the address information is for the\
            \ principal or secondary customer. \nThis is a required field.\n Valid\
            \ Codes:\n 01 : Principal Customer.\n 02 : Secondary Customer. "
        phoneNumber:
          type: string
          description: 'Phone number of the AttorneyThis is a required field. '
        phoneFlag:
          type: string
          description: 'Attorney Phone flag, for determining whether this telephone
            number is valid and/or whether this telephone number may be used to contact
            the customer. B - The phone number is valid and the account holder has
            provided express consent for SMS (short message service) text messages
            and voice contact. Phone numbers with this setting can be contacted by
            auto-dial methods dependent upon the value for the device type setting
            for this number.

            C - Do not contact customer at this telephone number because a cease and
            desist agreement has been filed. Phone numbers with this setting do not
            have express consent to be contacted by auto-dial methods.

            D - This number has been disconnected. Phone numbers with this setting
            do not have express consent to be contacted by auto-dial methods.

            E - The customer is no longer at this number.

            G - Customer agrees to portability. The phone number is valid and the
            account holder has provided express consent for voice contact. Phone numbers
            with this setting can be contacted by auto-dial methods dependent upon
            the value for the device type setting for this number.H - Customer does
            not agree to portability. Phone numbers with this setting do not have
            express consent to be contacted by auto-dial methods.

            N - The phone number is not valid. Phone numbers with this setting do
            not have express consent to be contacted by auto-dial methods.

            S - The phone number is valid and available for SMS (short message service)
            text messages only. Phone numbers with this setting do not have express
            consent to be contacted by auto-dial methods.

            U - The phone number is unlisted. Phone numbers with this setting do not
            have express consent to be contacted by auto-dial methods.

            V - The phone number is not verified. Phone numbers with this setting
            do not have express consent to be contacted by auto-dial methods.

            X - Do not contact the customer at this number. Phone numbers with this
            setting do not have express consent to be contacted by auto-dial methods.

            Y - The phone number is valid but the account holder has not provided
            express consent for auto-dial contact and must be contacted at this phone
            number manually and not by auto-dial methods.

            This is an optional field. If you enter a value in the telephone number
            field and leave this field blank, the System sets this field to Y.'
    UpdateAuthorizationFlagRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        authorizationControlCode:
          type: string
          description: "Code representing special authorization actions or privileges.\n\
            #### Valid Codes:\n**A** - Get new address. Do not print letters.\nYou\
            \ can override the effects of this code on correspondence generated via\
            \ the Cardholder Letters\nSystem when the Correspondence Flag on the cardholder\
            \ account record is set to 1 and the Statement Hold Code on the record\
            \ is set to R.\nTo override the code's effects, take the following actions.\n\
            1. Set the CORR FLAG OVERRIDE field on the LT01 03, Letter Definition\
            \ screen, to P - Print, for each item you want printed despite an Authorization\
            \ Control Code of A.\n2. Set the Letter Override Suppression Flag parameter\
            \ in the Operational Controls section (PF CM OC) of the Product Control\
            \ File to Y, which overrides a Hold Correspondence Flag of 1.\nOn purge/reinstatement\
            \ day, the System purges accounts with this code.\nThe System automatically\
            \ removes this code during nightly processing if you place a new address\
            \ on the account.\nHowever, if you use the Automatic Auth Flag parameter\
            \ in the Authorization Settings section (AU BC AS) of the\nProduct Control\
            \ File as part of an Adaptive Control authorization strategy, you must\
            \ update the address\nflag and/or the home phone flag as well as entering\
            \ the new address or home phone number.\n**M** - This account has an unresolved\
            \ dispute.\nProhibit the printing of past due letters. Place a hold code\
            \ on the statement.\nThe System prints the message DISPUTED ACCT on the\
            \ customer\uFFFDs statement.\n**Q** - Always authorize unless an external\
            \ status prohibits authorization.\nBe extremely cautious when assigning\
            \ a Q status to any account. Prohibit the printing of the following.\n\
            1. Delinquency notification statements\n2. Statement message generated\
            \ from delinquency message parameters of the Product Control File\n3.\
            \ Delinquency letters\n4. Overlimit courtesy statements\n5. Statement\
            \ message generated from overlimit message parameters of the Product Control\
            \ File\n6. Overlimit letters\nIf you use Adaptive Control, this code also\
            \ prohibits automatic credit line changes, automatic external status code\
            \ changes, and automatic charge offs.\n**S** - Identify all convenience\
            \ checks as stop payments.\n**V** - Do not print the same items listed\
            \ for valid code Q. Prohibit automatic credit line changes,\nautomatic\
            \ external status code changes, and automatic charge offs.\nBe extremely\
            \ cautious when assigning a V status to any account.\nYou can manually\
            \ request a letter by setting the statement hold code to a value other\
            \ than Y.\nIf you use Adaptive Control, you can allow automatic external\
            \ status code changes and automatic charge offs\nby setting the Chargeoff\
            \ Override parameter in the Restricted Fields section (PF PC RF) of the\
            \ Product Control File to 1.\nSetting the NM*165, Hold Correspondence\
            \ transaction, to 1 has the same effect as setting the authorization flag\
            \ to V.\n**Y** - Always decline authorization.\nAuthorizations for accounts\
            \ with this setting will be declined regardless of how you set the authorization\
            \ expansion tables\non the Product Control File. The System automatically\
            \ removes the Y code when the account is no longer delinquent.\n**blank**\
            \ - Normal authorization processing occurs. "
    UpdateBillingCycleCodeRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        billingCycleCode:
          type: string
          description: 'Code determining when the customer statement is generated.
            This is a required field. This code changes an account''s billing cycle
            code set in the Cyc Code Generation parameter. The System rejects this
            transaction if the billing cycle code does not correspond to your working-day
            or fixed-day billing cycle. The System will reject this transaction if
            both of the following conditions are met. 1) A change to an account''s
            billing cycle code would result in a shorter billing cycle than specified
            in the Minimum Days For Cycle Code Change parameter in the Interest Methods
            section (CP IC IM) of the Product Control File. 2) You have the Cycle
            Code Change Option parameter in the Interest Methods section (CP IC IM)
            of the Product Control File set to zero. If the System rejects the transaction
            under these conditions, INVALID SHORT BILLING CYCLE appears as the reject
            reason on the CD-052, Unposted Non-Monetary Items report. If you set the
            Cycle Code Change Option parameter to 1, the System will suspend the cycle
            code change until after the original cycle is past if it would be shorter
            than allowed by your setting in the Minimum Days For Cycle Code Change
            parameter in the Interest Charges section (CP IC IM) of the Product Control
            File. If this is a Commercial Card Single Payment account, use a working-day
            cycle code. All subaccounts and the control account must have the same
            billing cycle code. '
    UpdateBranchPortfoRequest:
      required:
