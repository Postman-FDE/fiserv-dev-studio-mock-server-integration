        lowerNonDelinquentPortionOfMinimumPaymentDueAmount:
          type: string
          description: 'Lower nondelinquent portion of minimum payment due amount.

            The value in this field replaces only the noninstallment portion of the

            minimum payment due for 90/180 days same as cash processing. You set

            90/180 days same as cash processing using the 90-day Processing

            parameter in the Promotional Purchases section (CP OC PP) of the Product

            Control File. '
        nonDelinquentPortionOfMinimumPaymentDueAmount:
          type: string
          description: "Nondelinquent portion of minimum payment due amount based\
