  /maintenance/v2/createDelinquentAmounts:
    post:
      tags:
      - Maintenance
      - Servicing
      - Operations & Execution
      - NM
      - Non-Mon
      - Non-Monetary
      - Non-Monetaries
      - Nonmon
      - Nonmons
      summary: Create Delinquent Amounts NM*183
      description: "Uses the NM*183, Create Delinquent Amounts transaction, to indicate\
        \ if an amount is to be added to \nor subtracted from the account\uFFFDs total\
        \ delinquency or cash advance delinquency.\nIf a payment posts during the\
        \ same billing cycle that you post a NM*183 transaction, the System \nreduces\
        \ the amount of the oldest delinquency by the amount of the payment. \nFor\
        \ example, assume that you made an agreement with the cardholder to reduce\
        \ the amount of the oldest \ndelinquency from $70 to $40 and on June 25 you\
        \ rebuilt an account\uFFFDs delinquency as follows.\nCycle 1: $40.00\nCycle\
        \ 2: $40.00\nCycle 3: $0.00\nCycle 4: $0.00\nAssume that a $30 payment posted\
        \ to the account on June 20. When the account cycles, the System further \n\
        reduces the amount of the oldest delinquency as follows.\nCycle 1: $40.00\n\
        Cycle 2: $10.00\nCycle 3: $0.00\nCycle 4: $0.00\nTo prevent a payment from\
        \ reducing the delinquency on the account, rebuild the delinquency to include\
        \ any \npayments posted during the current cycle, as shown in the following\
        \ example.\nCycle 1: $40.00; rebuilt delinquency\nCycle 2: $40.00; rebuilt\
        \ delinquency\nCycle 3: $30.00; amount of payment posted this cycle\nCycle\
        \ 4: $0.00\nBe aware that your automatic reage processing may be adversely\
        \ affected if you enter a NM*183 transaction and \nchange the total account\
        \ delinquency. If you increase the total delinquency, the account could reage\
        \ sooner than you\nexpect. If you decrease the delinquency, you could make\
        \ it more difficult for the account to reage.\nRequired Fields: common.accountId,\
        \ delinquencyCode, amountOne, amountTwo, amountThree, amountFour. <br><br>\
        \ <b>Relates to:</b>\n  \n  <blockquote style=\"border-left: 0.375em solid\
        \ #40a9ff; background-color: #e6f7ff; border-radius: 3px; padding: 1em;\"\
        \ ><div>CNONMON 183 RPC, <a target=\"_blank\" title=\"Click to open in a new\
        \ tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: createDelinquentAmounts_v2_maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelinquentAmountsRequest'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMaintUpdateResult'
      deprecated: false
      x-proxy-name: createDelinquentAmounts
      x-region:
      - North America
      x-display: Maintenance
      x-codegen-request-body-name: body
      x-group-name: Servicing
      x-child-product-name: Operations & Execution
