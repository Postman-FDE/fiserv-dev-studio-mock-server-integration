    UpdateStatementHoldCodeRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        heldStatementDestinationCode:
          type: string
          description: 'Code representing whether a hard copy statement is produced
            and where the hard copy statement is sent. Valid Codes: C - Sort hard
            copy statements according to customer account identifier and mail to you.
            D - System-generated code that represents default strategy ZBFD has been
            assigned to the customer. N - Send hard copy statement to customer. R
            - Returned mail; do not print a hard copy statement. If this field is
            set to R, the System generates the NM*165, Hold Correspondence transaction,
            to set the hold correspondence flag to 1. Be aware that setting the hold
            correspondence flag to 1 may prohibit the System from printing delinquency
            notification statements, over-limit courtesy statements, messages, and
            letters. In addition, it may prohibit the System from printing letters
            for automatic credit line changes, automatic external status code changes,
            and automatic charge offs. The System automatically changes R to N once
            you update address information. If this field is set to R, you can only
            change it to N. If you try to change this field to any other value, the
            System rejects the change and generates the following message: CARDHOLDER
            STMT HOLD CODE IS R. S - Send hard copy statement to First Data Fraud
            Management Services. If this field is set to S and you use the Adaptive
            Control System, automated letters and letter data generated out of the
            Adaptive Control System (ACS) will not be produced. V - Enlarge statement
            contents to fit on 11x14 paper and send to customer. W - Do not print
            a hard copy statement. Instead, produce the statement only for CIS (Customer
            Inquiry System) and on microfiche. Y - Send hard copy statement to you.
            If this field is set to Y and you use the Adaptive Control System, automated
            letters and letter data generated out of the Adaptive Control System will
            not be produced. 1-9 - Send hard copy statement to you for this number
            of billing cycles. Each time a statement is sent to you, the System subtracts
            1 from the number in this field. When the number reaches zero, the System
            resets the Held Statement Destination Code to N, the Held Statement Sort
            Distribution Code to zeros, and sends the next statement to the customer.
            If this field is set to 1-9 and you use the Adaptive Control System, automated
            letters and letter data generated out of the Adaptive Control System will
            not be produced. Use this field in conjunction with the SORT field to
            determine the person, department, or location receiving this held statement.
            If you set this field to N, you must set the SORT field to zeros. To remove
            a statement hold code from an account with an item in dispute, you must
            first clear the amount in dispute. Refer to the Cardholder Account Maintenance
            manual for more information about removing disputed amounts. '
        sort:
          type: string
          description: 'Identifier of the appropriate person, department, or location
            to receive statements sent to your institution. If you enter N in the
            CODE field, you must enter zeros in this field. Fixed length of 3 positions. '
    UpdateTemporaryCreditLineRequest:
      required:
      - amount
      - endDate
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        transactionIdentifier:
          type: string
          description: Non-Monetary Transaction Identifier of the non-monetary transaction.
            required parameter
        startDate:
          type: string
          description: 'START Date  (12/13/19) - Format: MMDDYY (U.S.), or, DDMMYY
            (non-U.S.).

            Length: fixed length, six positions.

            Edits: edited for zeros or valid date.

            This is an optional field.

            If you leave this field blank, the System sets it to the current processing

            day in the U.S. format.

            '
        endDate:
          type: string
          description: 'END Date(12/31/19) - Date the temporary credit line expires.

            Format: MMDDYY (U.S.), or, DDMMYY (non-U.S.).

            Length: fixed length, six positions.

            Edits: edited for zeros or valid date.

            This is a Required field.

            If you enter all zeros, this field defaults to the current date.

            The date you enter in this field cannot be prior to the date you enter
            in the START field.'
        amount:
          pattern: \d{1,13}
          type: string
          description: 'AMOUNT($1000) - Amount of the temporary credit line effective
            for the dates

            indicated in the START and END fields.

            Format: $$$$$$$$$$$$$

            Length: variable length, 13 positions.

            Edits: edited for numeric values.

            This is a Required field.'
          example: '032488'
        reason:
          pattern: '[a-zA-Z0-9]{3}|'
          type: string
          description: 'REASON (OAB)- User-defined code representing the reason why
            the temporary

            credit line was assigned.

            Length: fixed length, three positions.'
          example: cqw
        tclo:
          pattern: '[NnYy]'
          type: string
          description: "TCLO - Indicator designating whether you want to override\
            \ the System\uFFFDs rejection of the\ntemporary credit line entered.\n\
            Valid codes:\nN - No, do not override the System\uFFFDs rejection of the\
            \ temporary credit line.\nY - Yes, override the System\uFFFDs rejection\
            \ of the temporary credit line."
          example: n
