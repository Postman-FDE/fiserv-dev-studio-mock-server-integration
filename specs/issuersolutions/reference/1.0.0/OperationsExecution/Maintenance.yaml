          minLength: 0
          type: string
          description: External card type identifier. Maximum field length is 5 positions.
          example: PcIF3
        merchantAccountIdentifier:
          maxLength: 16
          minLength: 0
          type: string
          description: Identifier of the merchant account. Maximum field length is
            16 positions.
          example: lB5lRaXASWkmwih6
        merchantAdjustmentDescription:
          maxLength: 37
          minLength: 0
          type: string
          description: "Client-defined text describing the adjustment detail item\
            \ being entered. Use this field for transaction codes 253, 254, 255, and\
            \ 280. The message you enter appears on the customer statement. If you\
            \ do not enter a description for the 280, the message AN ADJUSTMENT TO\
