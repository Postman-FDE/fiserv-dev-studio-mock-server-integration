        \ name and address may be received from that table.  Required Fields: common.presentationId,\
        \ lenderInstitutionName, lenderInstitutionAddressText, lenderInstitutionCityText,\
        \ lenderInstitutionStateCode, lenderInstitutionZipCode, lenderPresentationIdentifier,\
        \ checkAmount. <br><br> <b>Relates to:</b>\n  \n  <blockquote style=\"border-left:\
        \ 0.375em solid #40a9ff; background-color: #e6f7ff; border-radius: 3px; padding:\
        \ 1em;\" ><div>BALANCE_CONSOLIDATION RPC, <a target=\"_blank\" title=\"Click\
