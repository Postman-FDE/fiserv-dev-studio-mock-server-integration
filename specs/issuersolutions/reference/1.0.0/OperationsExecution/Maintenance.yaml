  /maintenance/v2/phoneUpdate:
    post:
      tags:
      - Maintenance
      - Servicing
      - Operations & Execution
      - Customer Maintenance
      - Card Maintenance
      - Account Maintenance
      summary: CUSTOMER_UPDATE (ONLY UPDATES PHONE NUMBER) RPC
      description: "This service provides the ability to update the phone numbers\
        \ and consent codes. A consent code will default to a value of Y if a phone\
        \ number is populated. The consent code will be blank if the telephone is\
        \ not present. The list of valid consent codes are: B - The phone number is\
        \ valid and the account holder has provided express consent for SMS (short\
        \ message service) text messages and voice contact. Phone numbers with this\
        \ setting can be contacted by auto-dial methods dependent upon the value for\
        \ the device type setting for this number. C - Do not contact customer at\
        \ this telephone number because a cease and desist agreement has been filed.\
        \ Phone numbers with this setting do not have express consent to be contacted\
        \ by auto-dial methods. D - This number has been disconnected. Phone numbers\
        \ with this setting do not have express consent to be contacted by auto-dial\
        \ methods. E - The customer is no longer at this number. G - Customer agrees\
        \ to portability. The  number is valid and the account holder has provided\
        \ express consent for voice contact. Phone numbers with this setting can be\
        \ contacted by auto-dial methods dependent upon the value for the device type\
        \ setting for this number. H - Customer does not agree to portability. Phone\
        \ numbers with this setting do not have express consent to be contacted by\
        \ auto-dial methods. N - The phone number is not valid. Phone numbers with\
        \ this setting do not have express consent to be contacted by auto-dial methods.\
        \ S - The phone number is valid and available for SMS (short message service)\
        \ text messages only. Phone numbers with this setting do not have express\
        \ consent to be contacted by auto-dial methods. U - The phone number is unlisted.\
        \ Phone numbers with this setting do not have express consent to be contacted\
        \ by auto-dial methods. V - The phone number is not verified. Phone numbers\
        \ with this setting do not have express consent to be contacted by auto-dial\
        \ methods. X - Do not contact the customer at this number. Phone numbers with\
        \ this setting do not have express consent to be contacted by auto-dial methods.\
        \ Y - The phone number is valid but the account holder has not provided express\
        \ consent for auto-dial contact and must be contacted at this phone number\
        \ manually and not by auto-dial methods.<br><br> <b>Relates to:</b>\n  \n\
        \  <blockquote style=\"border-left: 0.375em solid #40a9ff; background-color:\
        \ #e6f7ff; border-radius: 3px; padding: 1em;\" ><div>CUSTOMER_UPDATE RPC,\
        \ <a target=\"_blank\" title=\"Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: phoneUpdate_v2_maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneUpdateRequest'
        required: false
      responses:
