        \ file is maintained at FDR. This function emulates the PB transaction and\
        \ is reserved for private label issuers who produce and distribute their own\
        \ warning bulletins. Required Fields: common.presentationId, purgeDate, actionCode<br><br>\
        \ <b>Relates to:</b>\n  \n  <blockquote style=\"border-left: 0.375em solid\
