          description: Amount of cash advance check to order for the cardholder.
          example: '4975890428.'
        promotionalTermsIdentifier:
          maxLength: 4
          minLength: 4
          type: string
          description: Identifier used to tie transactions to promotional terms.
          example: ONuj
    CheckOrderFlagRequest:
      required:
      - convenienceFeeFlagCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        convenienceFeeFlagCode:
          pattern: '[0-8]'
          type: string
          description: 'Code representing whether, how, and when to generate

            convenience checks for the account


            Valid codes:

            0 - Do not generate checks for the cardholder.

            1 - Generate new account checks manually for the cardholder.

            2 - Generate demand checks for the cardholder.

            3 - The System generates this code to issue convenience checks

            during reissue/purge processing.

            4 - Generate convenience checks for mass mailing.

            Valid code 4 is a temporary value for the Check Order Flag. After

            the transaction posts, the System resets this code to its previous

            value.5 - Generate test tapes for convenience checks.

            Valid code 5 is a temporary value for the Check Order Flag. After

            the transaction posts, the System resets this code to its previous

            value.

            6 - The System generates this code to report an automatic credit

            balance refund.

            Valid code 6 is a temporary value for the Check Order Flag. After

            the transaction posts, the System resets this code to its previous

            value.

            Refer to the Credit Balances chapter in the Cardholder Billing

            manual for more information about automatic credit balance

            refunds.

            7 - The System generates this code to report a manual credit balance

            refund.

            Valid code 7 is a temporary value for the Check Order Flag. After

            the transaction posts, the System resets this code to its previous

            value.

            Refer to the Credit Balances chapter in the Cardholder Billing

            manual for more information about manual credit balance

            refunds.

            8 - The System generates this code to report a manual misdirected

            payment refund.

            Valid code 8 is a temporary value for the Check Order Flag. After

            the transaction posts, the System resets this code to its previous

            value.

            Refer to the Credit Balances chapter in the Cardholder Billing

            manual for more information about refunds for misdirected

            payments.'
          example: '0'
        checkNumber:
          maxLength: 5
          minLength: 5
          type: string
          description: 'Number of the last convenience check issued

            Leave this field blank if you entered convenienceFeeFlagCode 1, 4, or
            5.'
          example: YErqw
        promotionalTermsIdentifier:
          maxLength: 4
          minLength: 4
          type: string
          description: "Identifier used to tie transactions to promotional terms.\n\
            \ If you enter 0 in the convenienceFeeFlagCode, do not use this field."
          example: QySO
    CheckOrderSpecialFlagRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        flagCode:
          pattern: (^$|[ QSZ])
          type: string
          description: "Code representing whether convenience checks are generated\
            \ for\nthe account\n\nValid codes:\nQ - Restrict the customer from receiving\
            \ convenience checks at the\ncustomer\uFFFDs request.\nS - The System\
            \ does not restrict customer-initiated orders of\nconvenience checks,\
            \ but the customer prefers not to receive\nunsolicited checks.\nIf you\
            \ select this option, you can manually generate convenience\nchecks that\
            \ were requested by the customer.\nThis code can be changed to another\
            \ value only if you manually\nenter a different code in this field or\
            \ in the corresponding field of\nan applicable transaction.\nBe aware\
            \ that you are responsible for ensuring that the customer\ndoes not receive\
            \ convenience checks he/she did not request,\nwhich may be generated by\
            \ your settings in parameters in the\nCheck Processing subject (AM CK)\
            \ of the Product Control File. You\ncan group accounts with this code\
            \ for special processing to\nprevent customers from receiving unsolicited\
            \ checks.\nZ - Restrict the customer from receiving convenience checks.\n\
            \ blank - Do not restrict the customer from receiving convenience checks.This\
            \ field also determines whether an account appears on the daily or weekly\
            \ check order tape."
          example: Q
