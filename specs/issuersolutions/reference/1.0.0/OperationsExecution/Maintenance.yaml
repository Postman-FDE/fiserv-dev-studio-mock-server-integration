        lowerConsecutiveOfflineLimitCount:
          type: string
          description: 'Count of offline transactions a customer can perform before
            an online authorization is required. '
        pinChangeControlCode:
          type: string
          description: 'Pin Change Control Code. '
        consecutiveTransactionInternationalUpperLimitNumber:
          type: string
