    UpdateCreditLimitRequest:
      required:
      - amount
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        amount:
          pattern: \d{1,13}
          type: string
          description: 'New credit line amount. '
          example: '02'
        letterFlag:
          type: string
          description: Letter flag
        code:
          type: string
          description: "Code representing the type of credit line change last made\
            \ to the account.\n #### Valid Codes:\n**A** - Automatic\n**C** - Permanently\
            \ deferred\n**D** - Adaptive Control decrease\n**I** - Adaptive Control\
            \ increase\n**M** - Manual\n**O** - Never increased\n**R** - Adaptive\
            \ Control increase or decrease using the LSX transaction\n**S** - Automatic\
            \ increase due to check transaction, maximum line without an available\
            \ credit buffer\n**T** - Increase due to additional deposit for secured\
            \ account\n**X** - Reserved for restricted use\n**Y** - Reserved for restricted\
            \ use\n**0** - Reserved for future use\n**1** - Reserved for future use\n\
            **2** - Automatic increase due to check transaction, maximum line with\
            \ an available credit buffer\n**3** - Decrease due to mid-cycle credit\
            \ line processing via Adaptive Control\n**4** - Increase due to mid-cycle\
            \ credit line processing via Adaptive Control\n**5** - Reserved for future\
            \ use\n**6** - Reserved for future use\n**7** - Reserved for future use\n\
            **8** - Reserved for restricted use\n**9** - Reserved for restricted use. "
        limitOverrideFlag:
          type: string
          description: "Credit Limit Override Flag; Indicator designating whether\
            \ you want to override the System\uFFFDs rejection of the credit line\
            \ entered #### Valid codes:\n**N** - No, do not override the System\uFFFD\
            s rejection of the credit line.\n**Y** - Yes, override the System\uFFFD\
            s rejection of the credit line."
    UpdateCreditLineRequest:
