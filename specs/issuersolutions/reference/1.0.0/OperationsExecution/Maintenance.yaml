    LockStrategyReallocationRequest:
      required:
      - area
      - status
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        area:
          type: string
          description: 'Code representing the strategy area.

            Valid code: CP - Cardholder Pricing.'
        status:
          type: string
          description: "Code representing the status of this account\uFFFDs strategy\n\
            Valid code: L - Locked."
        beginDate:
          type: string
          description: 'Date the strategy is to be locked onto this account.

            The value you set in this field must be equal to or greater than the current
            calendar day.

            If you leave this field blank and submit this transaction before

            non-monetary files have been retrieved for nightly processing, the System

            uses the current processing date.

            If you leave this field blank and submit this transaction after

            non-monetary files have been retrieved for nightly processing, the System

            automatically uses the date of the next processing day.

            ODS Format: MMDDYY.'
        endDate:
          type: string
          description: 'Date that the strategy lock is to be taken off this account.

            The value you set in this field must be greater than the value in the
            BEGINDATE field, and equal to or greater than the current calendar day.

            To keep a lock on an account, enter 999999.

            If you leave this field blank, the System uses 999999, which means the

            lock stays on the account.

            ODS Format: MMDDYY.'
        reallocate:
          pattern: I|
          type: string
          description: 'Code representing that an account should be immediately

            reviewed and, if applicable, reallocated during nightly processing on
            the

            day the strategy unlocks.

            Valid codes:

            I - Reallocate account immediately.

            blank - Do not reallocate account immediately.

            The account will allocate based on the allocation fields on the table
            control screen.

            '
