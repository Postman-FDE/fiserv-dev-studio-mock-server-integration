        departmentTwoCode:
          type: string
          description: ODS field DEPT_TWO_CD, Length 9.
        departmentThreeCode:
          type: string
          description: ODS field DEPT_THRE_CD, Length 9.
        departmentFourCode:
          type: string
          description: ODS field DEPT_FOUR_CD, Length 9.
        departmentFiveCode:
          type: string
          description: ODS field DEPT_FIVE_CD, Length 9.
        departmentSixCode:
          type: string
          description: ODS field DEPT_SIX_CD, Length 9.
        departmentSevenCode:
          type: string
          description: ODS field DEPT_SEVN_CD, Length 9.
        departmentEightCode:
          type: string
          description: ODS field DEPT_EGHT_CD, Length 9.
        departmentNineCode:
          type: string
          description: ODS field DEPT_NINE_CD, Length 9.
        departmentTenCode:
          type: string
          description: ODS field DEPT_TEN_CD, Length 9.
        batchType:
          maxLength: 2
          minLength: 2
