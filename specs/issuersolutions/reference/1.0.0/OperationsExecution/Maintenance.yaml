    NewCardholderAccountRequest:
      required:
      - applicationTypeCode
      - primaryAddressContinuationLineOneText
      - primaryCityName
      - primaryCustomerName
      - primarySubdivisionOneText
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        accountAcceptanceTermsCode:
          pattern: '[NRY]?'
          type: string
          description: 'Code representing whether a customer has accepted the terms
            and conditions associated with a credit or retail card. If you leave this
            field blank, the System uses your setting in the Accept Terms Default
            ID parameter in the ACH Processing section (AO ST AH) of the Product Control
            File. Valid codes: N - Terms were not accepted. R - Reserved for restricted
            use. Y - Terms were accepted. '
          example: N
        addressRelationshipTypeCode:
          pattern: '[BHOU]?'
          type: string
          description: 'Code representing the type of address displayed. If you do
            not set this field, the System sets it to U. Valid codes: B - Business
            street address. H - Home or residence street address. O - Other. U - Unknown. '
          example: B
        alternateLanguageCode:
          pattern: ([A-Za-z]{2})?
          type: string
          description: 'Code determining the language to use to produce customer correspondence
            for the account. Valid codes for this field are any client-defined codes
            you establish using the Client Language Definition file or the following
            FDR-assigned codes. Valid codes:  CF - Canadian French. EN - American
            English. SP - Latin American Spanish. '
          example: ''
        applicationCode:
          pattern: '[A-Za-z0-9]{0,2}'
          type: string
          description: 'Code representing the status of the application. '
          example: ''
        applicationTypeCode:
          pattern: '[A-Za-z0-9]'
          type: string
          description: 'Code representing the type of application. '
          example: A
        authorizationCode:
          pattern: '[A-Za-z0-9]?'
          type: string
          description: 'Code representing special authorization actions or privileges. '
          example: ''
        checkingAccountIdentifier:
          pattern: '[A-Za-z0-9]{0,17}'
          type: string
          description: 'Customer checking account identifier. '
          example: iHvcoAopmkgr35lh
        chargeDemandDepositAccountCode:
          pattern: '[A-Za-z0-9]?'
          type: string
          description: 'Code representing whether the customer account is set up for
            recurring automatic payments and, if so, whether to debit the customer''s
            checking or savings account for the automatic payment amount This amount
            can be the minimum payment due, the last statemented balance, the current
            balance, a designated amount, a fixed amount, or the automatic payment
            ceiling amount. Valid codes: H - Customer-Designated Amount Plus Unpaid
            Billed Minimum Payment Due (H or X Option), Payment Source - Checking
            account. J - Customer-Designated Amount (J or K Option), Payment Source
            - Checking account. K - Customer-Designated Amount (J or K Option), Payment
            Source - Savings account. N - Daily Current Balance Option (N or O Option),
            Payment Source - Checking account. O - Daily Current Balance Option (N
            or O Option), Payment Source - Savings account. R - Customer-Designated
            Amount or Unpaid Billed Minimum Payment Due Plus Overlimit Amount (R or
            S Option), Payment Source - Checking account. S - Customer-Designated
            Amount or Unpaid Billed Minimum Payment Due Plus Overlimit Amount (R or
            S Option), Payment Source - Savings account. T - Unpaid Billed Minimum
            Payment Due Plus Overlimit Amount (T or U Option), Payment Source - Checking
            account. U - Unpaid Billed Minimum Payment Due Plus Overlimit Amount (T
            or U Option), Payment Source - Savings account. X - Customer-Designated
            Amount Plus Unpaid Billed Minimum Payment Due (H or X Option), Payment
            Source - Savings account. Y - Customer-Designated Amount and Unpaid Billed
            Minimum Payment Due Plus Overlimit Amount (Y or Z Option), Payment Source
            - Checking account. Z - Customer-Designated Amount and Unpaid Billed Minimum
            Payment Due Plus Overlimit Amount (Y or Z Option, Payment Source - Savings
            account. 0 - Automatic payment is not set up for this account. Payment
            Source - Not applicable. 1 - Unpaid Billed Minimum Payment Due (1 or 5
            Option) , Payment Source - Checking account. 2 - Full Statemented Balance
            or Unpaid Billed Minimum Payment Due (2 or 6 Option), Payment Source -
            Checking account. 3 - Full Statemented Balance Including Disputes (3 Option)
            , Payment Source - Checking account or Savings account. 4 - Full Statemented
            Balance (4 or 7 Option) , Payment Source - Checking account. 5 - Unpaid
            Billed Minimum Payment Due (1 or 5 Option) , Payment Source - Savings
            account. 6 - Full Statemented Balance or Unpaid Billed Minimum Payment
            Due (2 or 6 Option), Payment Source - Savings account. 7 - Full Statemented
            Balance (4 or 7 Option) , Payment Source - Savings account. 8 - Full Statemented
            Balance Including Disputes Minus Cycle-to-Date Payments (8 Option), Payment
            Source - Checking account or Savings account. 9 - Customer-Designated
            Amount or Unpaid Billed Minimum Payment Due (9 Option), Payment Source
            - Checking account or Savings account. '
          example: e
        companyIdentifier:
          pattern: '[A-Za-z0-9]{0,8}'
          type: string
          description: 'Identifier of the company. '
          example: 5S
        controlAccountIdentifier:
          pattern: '[A-Za-z0-9]{0,16}'
          type: string
          description: 'Identifier of the control account. '
          example: yenOYJP
        creditBureauOverrideCode:
          pattern: ([A-Za-z0-9]{3})?
          type: string
          description: 'Code determining the credit bureau that will receive the credit
            bureau report request. Valid codes: EFC - Equifax Canada. EFX - Equifax.
            TRC - TransUnion Canada. TRU - TransUnion. TRW - Experian. '
          example: ''
        creditBureauReportCode:
          pattern: '[A-Za-z0-9]?'
          type: string
          description: 'Code representing either a request for an action related to
            credit reporting or the consumer''s liability for the account. Valid codes:
            D - Request deletion from credit bureau files. Q - Do not report. Z -
            Do not report. 1 - Individual This code represents a customer who has
            contractual responsibility for this account and is primarily responsible
            for payment. 2 - Joint contractual liability This code represents a customer
            and joint borrower who are both contractually liable. 3 - Authorized user
            This code represents a customer who can use this account without joint
            responsibility for payment. 5 - Co-maker This code represents cosigners
            without a spouse relationship. 7 - Maker This code represents a customer
            who is liable for the account, but the co-maker is liable if the maker
            defaults. '
          example: Z
        creditBureauReportRequestIndicator:
          pattern: '[YN]?'
          type: string
          description: 'Indicates a request for the credit bureau report. Valid codes:
            N - No, do not send for more information request for a credit bureau report.
            Y - Yes, send a request for a credit bureau report. blank - No, do not
            send a request for a credit bureau report. '
          example: ''
        creditBureauScoreIdentifier:
          pattern: '[A-Za-z0-9]{0,3}'
          type: string
          description: 'Identifier assigned based on evaluation of applicant''s credit
            history. '
          example: AZO
        creditLifeInsuranceCode:
          pattern: \d?
          type: string
          description: 'Account''s credit insurance flag. '
          example: '9'
        creditLimitAmount:
          pattern: \d{0,13}
          type: string
          description: 'Maximum amount of credit extended to this account. '
          example: '81675991829'
        miscellaneousFieldFourText:
          pattern: '[A-Za-z0-9]{0,10}'
          type: string
          description: 'Text in miscellaneous field 4. '
          example: WMGk3
        miscellaneousFieldOneText:
          pattern: '[A-Za-z0-9]{0,4}'
          type: string
          description: 'Text in miscellaneous field 1. '
          example: 8PMC
        miscellaneousFieldThreeText:
          pattern: '[A-Za-z0-9]{0,7}'
          type: string
          description: 'Text in miscellaneous field 3. '
          example: 4j
        miscellaneousFieldTwoText:
          pattern: '[A-Za-z0-9]{0,5}'
          type: string
          description: 'Text in miscellaneous field 2. '
          example: G
        motherMaidenName:
          pattern: '[A-Za-z0-9]{0,8}'
          type: string
          description: Customer's mother's maiden name.
          example: GKxF
        accountSystemEntryDate:
          type: string
          description: 'Date you entered this account. Ods Format: YYYYMMDD. '
        plasticCount:
          pattern: (\d{3})?
          type: string
          description: 'Count of plastics to issue. '
          example: '956'
        plasticExpirationDate:
          type: string
          description: 'Expiration date on plastic. Ods Format: MMYY. '
        plasticTypeCode:
          pattern: '[0-7]?'
          type: string
          description: 'Code determining the type of plastic to be issued. Valid codes:
            0 - Do not emboss plastics for the principal customer on this account.
            1 - Use the parameters in the Plastic Products strategy for plastic type
            1 to emboss plastics on this account. 2 - Use the parameters in the Plastic
            Products strategy for plastic type 2 to emboss plastics on this account.
            3 - Use the parameters in the Plastic Products strategy for plastic type
            3 to emboss plastics on this account. 4 - Use the parameters in the Plastic
            Products strategy for plastic type 4 to emboss plastics on this account.
            5 - Use the parameters in the Plastic Products strategy for plastic type
            5 to emboss plastics on this account. 6 - Do not emboss plastics or create
            embossing records for this account. This value is for special use when
            you set the Embossing Services Option parameter in the Embossing Processing
            section (AO AC EM) of the Product Control File to N. 7 - Do not emboss
            plastics or create embossing records for this account. This value is for
            special use when you set the Embossing Services Option parameter in the
            Embossing Processing section (AO AC EM) of the Product Control File to
            N. '
          example: ''
        primaryAddressContinuationLineOneText:
          pattern: '[A-Za-z0-9 ,]{1,50}'
          type: string
          description: 'Line one of customer''s mailing address. '
          example: NKuhvlLU Kk8l2FV41 Ix0
        primaryAddressContinuationLineTwoText:
          pattern: '[A-Za-z0-9 ,]{0,50}'
          type: string
          description: 'Line two of customer''s mailing address. '
          example: 96Dw7RhvD2tGMz7h8EwLQ0YB
        primarySubdivisionOneText:
          pattern: '[A-Za-z0-9]{1,25}'
          type: string
          description: 'First subdivision of the customer''s mailing address. '
          example: d
        primaryBirthDate:
          type: string
          description: 'Primary customer''s date of birth. Ods Format: YYYYMMDD. '
        primaryBusinessPhoneIdentifier:
          pattern: (\d{10})?
          type: string
          description: 'Business area code and telephone number of the customer. '
          example: '2136380751'
        primaryCityName:
          pattern: '[A-Za-z0-9 ]{1,18}'
          type: string
          description: 'Name of the city in the customer''s mailing address. '
          example: nRjTfWQ
        primaryCustomerName:
          pattern: '[A-Za-z0-9 ,]{1,26}'
          type: string
          description: 'Name of the primary customer. '
          example: wcCY
        primaryHomePhoneIdentifier:
          pattern: (\d{10})?
          type: string
          description: Primary customer's home telephone number.
          example: '9632911355'
        primaryIdentificationCode:
          pattern: \d{0,9}
          type: string
          description: 'Primary customer''s identification code. '
          example: '523'
        primaryPostalCode:
          pattern: '[A-Za-z0-9]{0,10}'
          type: string
          description: 'Primary customer''s mailing address postal code. '
          example: 5Ud
        primarySalutationCode:
          pattern: '[CFMU]?'
          type: string
          description: 'Code determining the salutation to be used in correspondence
            with the customer. Valid codes: C - Sir. F - Ms. M - Mr. U - No salutation
            printed. '
          example: ''
        relationshipControlCode:
          pattern: '[DK]?'
          type: string
          description: "Code representing whether a customer account is linked to\
            \ a Relationship Processing\uFFFD group and, if so, what relationship\
            \ the account has to the group. Valid codes: D - Dependent cardholder\
            \ account. K - Key cardholder account. blank - Unrelated account. "
          example: D
        rushPlasticCode:
          pattern: ([A-Za-z0-9]{2})?
          type: string
          description: 'Code representing the shipping method for rush plastics. '
          example: Rg
        secondaryCustomerName:
          pattern: '[A-Za-z0-9]{0,26}'
          type: string
          description: 'Name of the secondary customer. '
          example: Q3FZVSDD5VcA
        secondaryIdentificationCode:
          pattern: \d{0,9}
          type: string
          description: 'Secondary customer''s identification code. '
          example: '71758395'
        specialFlagSixSevenEightCode:
          pattern: ([A-Za-z0-9]{3})?
          type: string
          description: 'Special flags identifying special conditions on the customer
            record. '
          example: ''
        serviceCode:
          pattern: ([01]{7})?
          type: string
          description: 'Issuer-defined fields identifying services used by customer.
            Seven fields, one position each.Valid codes:0 - Not used by the customer.
            1 - Used by the customer. '
          example: ''
        savingsAccountIdentifier:
          pattern: '[A-Za-z0-9]{0,17}'
          type: string
          description: 'Customer''s savings account identifier. '
          example: 1E6PNOK4GbmCp
        crossReferenceAccountIdentifier:
          pattern: \d{0,16}
          type: string
          description: 'Number identifying another account associated with the applicant. '
          example: '712153'
    NewPresentationInstrumentAddRequest:
