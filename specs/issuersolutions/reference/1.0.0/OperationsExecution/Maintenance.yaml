          description: 'Message identifying the nature of the response. '
        referenceNumber:
          type: string
          description: 'Reference number: This field will be zeros if there is an
            error. If there is no error, the number returned in this field is used
            in the CONFIRMATION_REPLY remote procedure call to get MasterCard''s response. '
        statusCode:
          type: string
          description: 'Number identifying the severity of the response. Valid codes:
            2 - Error or 4 - Complete. '
        severityCode:
          type: string
          description: 'Code identifying the status of the response. Valid codes:
            ERROR or CMPLT '
    MasterCardWarningBulletinRequest:
