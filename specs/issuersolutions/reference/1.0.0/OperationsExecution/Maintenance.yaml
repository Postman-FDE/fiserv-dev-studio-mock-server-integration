          type: string
          description: 'Warning Bulletin Reason Code: Code representing the reason
            the customer account is being placed on the warning bulletin. Valid codes:
            C - Customer is a credit risk. F - Plastic has had fraudulent activity.
            O - Account is being placed on the warning bulletin for a reason other
            than valid codes C, F, or X. X - Plastic is counterfeit. '
        regionCode1PurgeDate:
          type: string
          description: 'Five fixed-length, 7-position fields (XYYMMDD) identifying
            each  warning bulletin region where the cardholder number is to be  listed
            (X) followed by the corresponding date (YYMMDD) the  cardholder number
            is to be purged from the warning bulletin  files; first field required.  The
            first position of each field is edited for a valid region code.  The last
            six positions of each field are edited for a valid date.  Refer to the
            Maps and Tables part of this manual for valid  Mastercard warning bulletin
            region codes.  Use region code I to list a cardholder number in the internal  region
            of the FDR Warning Bulletin Master File. The  cardholder number will not
            be listed with Mastercard.  For example, to place a cardholder number
            on warning  bulletins in regions 1 and B until June 23, 2000, enter the  following.  1000623
            B000623  If you want to delete a cardholder number from the warning  bulletin,
            use the current date as the purge date. '
        regionCode2PurgeDate:
          type: string
          description: 'Region Code 2 and Purge Date: Ods Format XYYMMDD. '
