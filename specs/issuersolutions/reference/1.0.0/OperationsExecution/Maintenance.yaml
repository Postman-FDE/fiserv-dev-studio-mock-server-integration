          description: 'Propagation Level Code

            Code representing the level of the company at which the System will propagate
            the indicated non-monetary changes.Propagate the change(s) to all accounts
            in the company, unless excluded on the basis of external status or account
            type.Use code "C" to propagate to all the subaccounts to activate.

            Valid codes:

            C - Company level

            S - Control account to subaccounts

            ODS Field CMPN_PRPG_LEVL_CD'
          example: C
        cardActivationCode:
