          pattern: AU|BA|BC|BF|BP|BR|BU|B1|CA|CC|CF|CP|CR|CU|C1|DU|XA|XF|XU|ZA|ZF|ZU
          type: string
          description: "ODS field RUSH_MAIL_CD, Length 2. Code representing the shipping\
            \ method for rush plastics.\nValid codes are:\nAU - Send plastics to you\
            \ via UPS Next Day Air shipment.\nBA - Send plastics to you via DHL shipment.\
            \ DHL is only used for international shipments.\nBC - Send plastics to\
            \ you via United States Postal Service (USPS) Certified Mail shipment.\n\
            BF - Send plastics to you via FedEx shipment.\nBP - Send plastics to you\
            \ via United States Postal Service (USPS) Express Mail shipment.\nBR -\
            \ Send plastics to you via United States Postal Service (USPS) Registered\
            \ Mail shipment.\nBU - Send plastics to you via UPS\uFFFD Next Day Air\
            \ Saver shipment.\nB1 - Send plastics to you via United States Postal\
            \ Service (USPS) First-Class Mail\uFFFDshipment.\nCA - Send plastics to\
            \ customer via DHL shipment.DHL is only used for international shipments.\n\
            CC - Send plastics to customer via United States Postal Service (USPS)\
            \ Certified Mail shipment.\nCF - Send plastics to customer via FedEx shipment.\n\
            CP - Send plastics to customer via United States Postal Service (USPS)\
            \ Express Mail shipment.\nCR - Send plastics to customer via United States\
            \ Postal Service (USPS) Registered Mail shipment.\nCU - Send plastics\
            \ to customer via UPS Next Day Air Saver shipment.\nC1 - Send plastics\
            \ to customer via United States Postal Service (USPS) First-Class Mail\
            \ shipment.\nDU - Send plastics to customer via UPS Next Day Air\uFFFD\
            \ shipment.\nXA - Send plastics to customer for Saturday delivery via\
            \ FedEx shipment.\nXF - Send plastics to customer for Saturday delivery\
            \ via FedEx shipment.\nXU - Send plastics to customer for Saturday delivery\
            \ via UPS Next Day Air shipment.\nZA - Send plastics to you for Saturday\
            \ delivery via FedEx\uFFFD shipment.\nZF - Send plastics to you for Saturday\
            \ delivery via FedEx\uFFFD shipment.\nZU - Send plastics to you for Saturday\
            \ delivery via UPS\uFFFD Next Day Air shipment."
          example: BA
        memberSequenceIdentifier:
          type: string
          description: ODS field MBR_SQNC_ID, Length 5. Member sequence identifier
            representing a specific customer on the account.
