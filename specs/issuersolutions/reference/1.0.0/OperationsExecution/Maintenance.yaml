      summary: NM*99
      description: "This service updates annual activity summary code, which determines\
        \ whether a cardholder receives a year-end summary, whether the system generates\
        \ a fee, and what fee to assess. Valid codes: 0 - If the setting in the Charge\
        \ Option parameter is 2, create a year-end summary and do not generate an\
        \ automatic charge. If the setting in theCharge Option parameter is 3, create\
        \ a year-end summary and charge rate 1 specified in the Charge 1 parameter.\
        \ If the setting in the Charge Option parameter is 4, do not create a year-end\
        \ summary and do not generate an automatic charge.1 - Create a year-end summary.\
        \ If the setting in the Charge Option parameter is 2, 3, or 4, charge rate\
        \ 1 specified in the Charge 1 parameter. 2 - Create a year-end summary. If\
        \ the setting in the Charge Option parameter is 2, 3, or 4, charge rate 2\
        \ specified in the Charge 2parameter. 3 - Create a year-end summary. If the\
        \ setting in the Charge Option parameter is 2, 3, or 4, do not generate an\
        \ automatic charge. 4 - If the setting in the Charge Option parameter is 2,\
        \ 3, or 4, do not create a year-end summary and do not generate an automatic\
        \ charge.<br><br> <b>Relates to:</b>\n  \n  <blockquote style=\"border-left:\
        \ 0.375em solid #40a9ff; background-color: #e6f7ff; border-radius: 3px; padding:\
        \ 1em;\" ><div>CNONMON 099 RPC, <a target=\"_blank\" title=\"Click to open\
        \ in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: annualStatement_v2_maintenance
      requestBody:
