  /maintenance/v2/updateMinimumDueDate:
    post:
      tags:
      - Maintenance
      - Servicing
      - Operations & Execution
      - NM
      - Non-Mon
      - Non-Monetary
      - Non-Monetaries
      - Nonmon
      - Nonmons
      summary: Minimum Due Date NM*184
      description: "Uses the NM*184, Update Minimum Payment Due transaction, to indicate\
        \ the \nnondelinquent portion of the minimum payment due amount on a cardholder\
        \ account. \nBe aware that this transaction does not lower the minimum payment\
        \ due \n(MPD) amount for promotions with unique MPD calculations. To lower\
        \ a \nunique promotion MPD amount, use the BILLED PAY DUE field on the *CM2\
        \ \nscreen of the CME, Customer Promotional Purchase Expanded Display \ntransaction,\
        \ or the tape-entered NM*154*09, Lower Non-delinquent \nPromotional Balance\
        \ MPD transaction. \nThe System calculates the minimum payment due at statement\
        \ cycle time \naccording to your Product Control File (PCF) settings. The\
        \ System does not \nstore the nondelinquent portion of the minimum payment\
        \ due amount on the \nCardholder Master File, but recalculates it every time\
        \ it is needed, by \nsubtracting the last statement delinquent amount from\
        \ the last statement \nbilled payment due. The resulting value is displayed\
        \ in the lower \nnondelinquent minimum payment due field on the NM CL1, Account\
        \ Collection \n- Level 1 screen. \nWhen you enter a NM*184 transaction to\
        \ change the nondelinquent portion of \nthe billed payment due, the System\
        \ clears the amount stored in the last \nstatement billed payment due field.\
        \ The System then adds the new amount \nyou entered in the lower nondelinquent\
        \ minimum payment due field to the \nlast statement delinquent amount and\
        \ stores the total in the last statement \nbilled payment due field on the\
        \ Cardholder Master File. The System also \nreposts any cycle-to-date payments.\
        \ \nFor example, assume that an account completes a billing cycle with a last\
        \ \nstatement billed payment due of $150.00, of which $100.00 is delinquent\
        \ and \n$50.00 is nondelinquent. A payment of $30 posts, and you enter the\
        \ NM*184 \ntransaction on a subsequent processing day to lower the nondelinquent\
        \ \nportion of the payment due from $50.00 to $25.00. The System recalculates\
        \ \nthe last statement billed payment due by adding the last statement delinquent\
        \ \namount ($100.00) to the value you entered via the NM*184 ($25.00) and\
        \ \nstores the result ($125.00) in the last statement billed payment due field.\
        \ The \nSystem also reposts the $30 payment. \nThe next time the account completes\
        \ a billing cycle, the System calculates the \nnew minimum payment due amount.\
        \ It adds the new minimum payment due \nto the total of all delinquent amounts\
        \ and stores the result in the last \nstatement billed payment due field.\
        \ \nBe aware that your automatic reage processing could be adversely affected\
        \ if \nyou set the nondelinquent portion of the billed payment due to a small\
        \ \namount or zero. \nIf the account uses automatic payment calculation option\
        \ A or B (Minimum \nPayment Due Minus Delinquent Amount), H or X (Customer-Designated\
        \ \nAmount Plus Unpaid Billed Minimum Payment Due), or 1 or 5 (Unpaid Billed\
        \ \nMinimum Payment Due), you determine whether the NM*184 transaction can\
        \ \ndecrease this amount only or either increase or decrease it by setting\
        \ the \nAdjust Stipulated Auto Pay parameter in the Automatic Payments section\
        \ \n(AO CH AP) of the PCF. Your setting of this parameter affects both the\
        \ \nnondelinquent portion of the minimum payment due and the automatic \n\
        payment amount.\nRequired Fields: common.accountId, lowerNonDelinquentPortionOfMinimumPaymentDueAmount,\
        \ or nonDelinquentPortionOfMinimumPaymentDueAmount. <br><br> <b>Relates to:</b>\n\
        \  \n  <blockquote style=\"border-left: 0.375em solid #40a9ff; background-color:\
        \ #e6f7ff; border-radius: 3px; padding: 1em;\" ><div>CNONMON 184 RPC, <a target=\"\
        _blank\" title=\"Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
