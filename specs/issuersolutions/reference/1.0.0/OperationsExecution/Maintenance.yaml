    UpdateUnusualAddressRequest:
      required:
      - addressLineOne
      - city
      - state
      - zipCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        addressLineOne:
          type: string
          description: "Text of the first line of the customer\uFFFDs mailing address.\
            \ Length: 26."
        city:
          type: string
          description: "Name of the city in the primary customer\uFFFDs mailing address.\
            \ Length: 18\nFor non-U.S. countries, enter the country in this field\
            \ and the city in the address line 2 field, using the unformatted NM*8,\
            \ Address Line 2 transaction."
        state:
          type: string
          description: "Code representing the state in the customer\uFFFDs mailing\
            \ address"
        zipCode:
          type: string
          description: "ZIP code of the primary customer\uFFFDs mailing address"
        letter:
          type: string
          description: "Code determining whether you want the System to generate letters\
            \ and send them to a customer\uFFFDs new and old address to notify them\
            \ of this address change.\n#### Valid Codes:\n**Y** - Yes, generate letters\
            \ when an address changes.\n**blank** - No, do not generate letters when\
            \ an address changes."
        propagate:
          type: string
          description: 'Code determining whether to allow address changes made to
            a control account to extend to its related sub-accounts.

            #### Valid Codes:

            **Y** - Yes, propagate address change.

            **N** - No, do not propagate address change.'
        bypass:
          type: string
          description: 'Code determining whether the System bypasses the address during
            the automatic address correction phase of address validation

            #### Valid Codes:

            **B** - Bypass the address during the automatic address correction phase
            of the United States address validation process.

            **C** - Bypass the address during the automatic address correction phase
            of the following United States address validation processes.

            Valid code C changes to Y automatically when you make any changes to the
            address.

            **X** - No forwarding address is available for a customer who does not
            live at the address on file according to the most recently completed NCOA
            process through First Data. Consequently, the System generates the X to
            bypass the address during the address correction phase of both this process
            and the United States address validation process.

            **Y** - Do not bypass the address during the automatic address correction
            phase of the United States address validation process or the NCOA process
            through First Data if this process is in use.'
        addressLineTwo:
          type: string
          description: "Text of the second line of the customer\uFFFDs mailing address.\
            \ Length 26"
