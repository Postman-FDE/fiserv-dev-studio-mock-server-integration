    TransactionMatchingAddRequest:
      required:
      - cardAcceptorOrMerchantId
      - monetaryTransactionCode
      - promoCodeId
      - transactionAmount
      - transactionDate
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        monetaryTransactionCode:
          pattern: 253|254|255
          type: string
          description: Monetary Transaction Code. Must be 253, 254, 255.
          example: '253'
        transactionAmount:
          pattern: (?!0+.00$)\d{1,16}\.\d{2}
          type: string
          description: Amount of the monetary transaction. Value must be greater than
            zero. Expected format as 9.99. Maximum length is 19 including the decimal
            point.
          example: '6837525855.96'
        transactionDate:
          type: string
          description: 'Date of the monetary transaction. Ods Format: YYYYMMDD.'
        cardAcceptorOrMerchantId:
          pattern: (?!0+$)\d+| +
          type: string
          description: Unique number identifying the card acceptor or merchant account.
            Must be a non-zero whole number.
          example: '                    '
        flapId:
          pattern: \d*
          type: string
          description: Unique number to identify a FLAP to a cardholder account. Must
            be a whole number.
          example: '5597344257285014851990692452752788512866343479538'
        promoCodeId:
          type: string
          description: Promotion Code Identifier.
