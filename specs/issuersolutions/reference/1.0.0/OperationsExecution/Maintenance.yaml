            This is a required field.

            #### Valid codes:

            **01** - Primary

            **02** - Secondary

            **03** - Additional name. '
        memberSequenceIdentifier:
          type: string
          description: 'System-assigned code representing a specific customer on the
            account.

            This is a required field.

            #### Valid codes:

            **00001** - Principal customer

            **00002** - Secondary customer

            **00003-00250** - Additional names customer. '
        keyIndexNumber:
          type: string
          description: 'Number identifying one of the 24 different encryption keys
            that is associated with the chip card.

            This is a required field. '
        emvApplicationName:
          type: string
          description: 'Name of the Europay Mastercard Visa (EMV) application that
            is on the chip card.

            This is a required field. '
        chipTypeCode:
          type: string
          description: 'Code representing the authorization method encoded on the
            chip card.

            This is a required field.

            #### Valid codes:

            **PIN** - PIN-based authorizations

            **SIG** - Signature-based authorizations. '
        cardProfileIdentifier:
          type: string
          description: 'Current profile identifier associated with the chip card.

            This is a required field. '
        presentationInstrumentTypeCode:
          type: string
          description: "Code representing a device associated with an account number,\
            \ a presentation instrument, or a device used for an authorization.\n\
            This is a required field.\n#### Valid codes:\n**01** - Plastic card\n\
            **02** - Contactless chip card\n**03** - External token secure element\n\
            **04** - External token card on file\n(Visa uses a token type code of\
            \ 05 to represent tokens used by electronic commerce enablers, such as\
            \ Visa\uFFFD Checkout. The System processes and reports a Visa token type\
            \ code 05 as a PI type code 04.)\n**05** - External token Host Card Emulation\
            \ (HCE)\n**06** - Europay Mastercard Visa (EMV) Dual Interface (contactless\
            \ and contact) chip card\n**07** - Mobile device\n**08** - Europay Mastercard\
            \ Visa (EMV) Contact Only chip card\n**14** - Internal token secure element\n\
            **13** - Internal token card on file\n**15** - Internal token Host Card\
            \ Emulation (HCE)\n**16** - Virtual/digital ID\n**99** - Unassigned. "
        expirationDate:
          type: string
          description: 'Date the chip card will no longer pass the authorization process.
            Ods Date Format is YYYY-MM-DD. '
        updateCardProfileCode:
          type: string
          description: "Code determining whether the chip card\uFFFDs profile can\
            \ be updated when it\uFFFDs reissued.\n#### Valid codes:\n**L** - The\
            \ current personalization settings on the card can be used after the card\
            \ is reissued.\n**U** - A different profile identifier can be used after\
            \ the card is reissued. "
        chipBlockIndicator:
          type: string
          description: 'Indicator designating whether usage of the chip card has been
            blocked.

            #### Valid values:

            **N** - No, the chip card has not been blocked.

            **Y** - Yes, the chip card has been blocked. '
        applicationBlockIndicator:
          type: string
          description: 'Indicator designating whether the EMV application on the chip
            card has been blocked.

            #### Valid values

            **N** - No, the EMV application has not been blocked.

            **Y** - Yes, the EMV application has been blocked. '
        encryptedPinBlockGenerateIndicator:
          type: string
          description: 'Encrypted Pin Block Generate Indicator. '
        updateLowerConsecutiveOfflineCode:
          type: string
          description: 'Code determining whether the lower consecutive offline count
            is locked, or can be changed, for the chip card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
            in locked status.

            **L** - Current count is locked for the customer.

            **T** - Update this count even if it has a locked status and leave it
            in unlocked status.

            **U** - Current count can be changed.

            **blank** - Current count can be changed. '
        updateUpperConsecutiveOfflineLimitCode:
          type: string
          description: 'Code determining whether the upper consecutive offline limit
            count is locked, or can be changed, for the chip card.

            #### Valid codes:

            **F** - Update this count even if it has a locked status and leave it
            in locked status.

            **L** - Current count is locked for the customer.

            **T** - Update this count even if it has a locked status and leave it
            in unlocked status.

            **U** - Current count can be changed.

            **blank** - Current count can be changed. '
        updateLowerConsecutiveOfflineAmountCode:
          type: string
          description: 'Update code determining whether the lower consecutive offline
            limit amount is locked, or can be changed, for the chip card.

            #### Valid codes:

            **F** - Update this amount even if it has a locked status and leave it
            in locked status.

            **L** - Current amount is locked for the customer.

            **T** - Update this amount even if it has a locked status and leave it
            in unlocked status.

            **U** - Current amount can be changed.

            **blank** - Current amount can be changed. '
        updateUpperConsecutiveOfflineAmountCode:
          type: string
          description: 'Code determining whether the upper consecutive offline amount
            is locked, or can be changed, for the chip card.

            #### Valid codes:

            **F** - Update this amount even if it has a locked status and leave it
            in locked status.

            **L** - Current amount is locked for the customer.

            **T** - Update this amount even if it has a locked status and leave it
            in unlocked status.

            **U** - Current amount can be changed.

            **blank** - Current amount can be changed. '
        lowerConsecutiveOfflineLimitAmount:
          type: string
          description: 'Total amount of transactions authorized offline that can occur
            before an online authorization is forced. '
        updateConsecutiveOfflineLimitAmount:
          type: string
          description: 'Total amount of transactions authorized offline that can occur
            before a transaction is denied. '
        pinTryLimitCount:
