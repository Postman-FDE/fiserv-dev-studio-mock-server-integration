          minLength: 0
          type: string
          description: Client-defined identifier of the vehicle.
          example: dpzpwDrB39MIZxTYw
        description:
          maxLength: 26
          minLength: 0
          type: string
          description: Description of the vehicle up to 26 characters in length. This
            field is required when adding a vehicle identifier.
          example: klXYSAUljbeMRndGpoZytn5vXF
        vehicleIdentificationNumber:
          maxLength: 17
          minLength: 0
          type: string
          description: VIN number associated with the vehicle.
          example: bobEC1Mx3WamCLN6O
        licensePlateIdentifier:
          maxLength: 15
          minLength: 0
          type: string
          description: The license plate number for the vehicle.
          example: zhWHvnU9juSHL9F
        licensePlateExpirationDate:
          type: string
          description: 'Expiration date of the vehicle''s registration. Ods Format:
            YYYYMMDD.'
        maximumMilePerGallonNumber:
          pattern: \d{1,3}
          type: string
          description: Maximum count of miles per gallon that can be expected for
            the vehicle.
          example: '01'
        minimumMilePerGallonNumber:
          pattern: \d{1,3}
          type: string
          description: Minimum count of miles per gallon that can be expected for
            the vehicle.
          example: '64'
        tankCapacityNumber:
          pattern: \d{1,3}
          type: string
          description: Tank capacity for the vehicle fuel tank.
          example: '725'
        registrationExpirationDate:
          type: string
          description: 'Expiration date of the vehicle''s registration. Ods Format:
            YYYYMMDD.'
        fuelTypeCode:
          pattern: \d{1,3}
          type: string
          description: Fuel Type Code for the vehicle.
          example: '66'
        additionalDescription:
          maxLength: 50
          minLength: 0
          type: string
          description: Additional description. 50 characters in length.
          example: HnvXdzD10uQtLaxQPVstkhJPjIcXsyj0vxfnNRKJm5Coj5jyej
        dayHourIdentifier:
          maxLength: 8
          minLength: 0
          type: string
          description: User-defined identifier of the authorization day hour restriction.
          example: 5Sag8XPA
        updateVehicleId:
          type: boolean
          description: False (default) - Add a vehicle identifier. True - update an
            existing vehicle identifier. Expected format are 'true' or 'false'.
    VerifyPinRequest:
      required:
      - pinVerificationId
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        pinVerificationId:
          maxLength: 5
          minLength: 1
          type: string
          description: 'PIN verification identifier for the presentation instrument.

            Fixed-length,1-Minimum 5-Maximum  position, edited for numeric required
            values.

            '
          example: INzcz
        customerRoleCode:
          pattern: '01|02|03'
          type: string
          description: ODS field CUST_ROLE_CD, Length 2
          example: '01'
        memberSequenceIdentifier:
          maxLength: 5
          minLength: 0
          type: string
          description: ODS field MBR_SQNC_ID, Length 5. Member sequence identifier
            representing a specific customer on the account.
          example: ijFqt
    VisaFeeRecoveryRequest:
      required:
      - eventDate
      - source
      - sourceTypeCode
      - transactionAmount
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        transactionDestinationId:
          type: string
          description: "Visa\uFFFD BankIdentificationNumber(BIN) identifying the member\
            \ from whom the fee is to be recovered\nThis field is required if you\
            \ are reversing an FRV transaction that was entered incorrectly or in\
            \ error and for original transactions that have 0140 in the REASON field.\
            \ Leave this field blank if you are entering an original transaction with\
            \ a cardholder account number."
        source:
          type: string
          description: Visa BIN identifying the member initiating the FRV transaction,
            Length 6
        sourceTypeCode:
          pattern: '[IA]'
          type: string
          description: "Code representing whether the BIN identified in the source\
            \ field belongs to the acquirer or issuer.\n#### Valid Codes: \nA - Acquirer\
            \ \nI - Issuer \n"
          example: A
        senderPrincipalId:
          pattern: '[0-9]{4}'
          type: string
          description: Principal Identifier for the member initiating the FRV, length
            4.
          example: '0402'
        transactionCurrencyCode:
          pattern: '[0-9]{3}'
          type: string
          description: "Code representing the type of currency used for entry. \n\
            If you enter a currency code in this field, the code you enter must match\
            \ the currency code for the source member's BIN. If the currency code\
            \ you enter does not match the source member's BIN, the message INVALID\
            \ CURRENCY CODE appears. If you leave this field blank, the System automatically\
            \ fills this field with the currency code for the source member's BIN.\n\
            Settlement will be made in the financial institution's defined settlement\
            \ currency."
          example: '412'
        messageReasonCode:
          pattern: '[06][0-9]{3}'
          type: string
          description: "#### Valid Codes: \n0100 - International telex, telephone,\
            \ or cable authorization charge. U.S. members cannot use 0100 to collect\
            \ from other U.S. members. \n0110 - International auto-telex authorization\
            \ charge. U.S. members cannot use 0110 to collect from other U.S. members.\n\
            0130 - Lost/stolen card report fee\n0140 - International merchant service\
            \ fee. U.S. members cannot use 0140 to collect from other U.S. members.\n\
            0150 - Recovered card handling fees/reward\n0170 - Recovery of copy/original\
            \ fees\n0190 - Return guaranteed check; valid only for Visa's Premier\
            \ card\n0200 - Emergency replacement card distribution fee\n0210 - Emergency\
            \ cash disbursement handling fee\n0220 - Arbitration case decision and/or\
            \ request fee\n0230 - Incorrect merchant identification/transaction data\
            \ handling fee; valid only in the United States\n0240 - Good faith collection\
            \ letters\n0300 - Bill payment service; valid for use in Canada and Brazil\
            \ only\n0350 - Prearbitration settlement\n0370 - International Airline\
            \ Program authorization fee\n0390 - Visa TravelMoney fee\n0400 - Visa\
            \ cash load settlement\n0401 - Prepaid revenue allocation\n0402 - Uncleared\
            \ prepaid or original credit authorization code\n6100 - Cardholder fee\
            \ assessment\n6110 - Cardholder fee reversal\n6120 - Cardholder credit/rebate\n\
            6130 - Cardholder credit/rebate reversal\n"
          example: '0624'
        merchantCountryCode:
          type: string
          description: 'Code representing the merchant''s country. Length 2

            This field is required for reason codes 0100 and 0190.'
        eventDate:
          type: string
          description: Date when the action occurred for which a fee is being recovered,
            Format MMDD
        accountIdentifier:
          maxLength: 16
          minLength: 0
          type: string
          description: Account identifier or presentation instrument identifier. Max
            Length 16
          example: BZ9SS90EQiU0uZWj
        transactionAmount:
          type: string
          description: Amount of the fee recovery transaction, Length 12, Format $$$$$$$$$$cc.
        type:
          type: string
          description: '#### Valid codes:

            R - Reversal of a prior FRV transaction that was entered incorrectly or
            in error

            blank - Original transaction.'
        messageText:
          maxLength: 70
          minLength: 0
          type: string
          description: Text describing this fee recovery transaction, Length 70
          example: ''
        locatorNumberIdentifier:
          maxLength: 11
          minLength: 11
          type: string
          description: "Client-defined identifier of the payment. \nThis number is\
            \ used to generate the acquirer's reference number for payments. Length\
            \ 11"
          example: IM2MrWDnxgM
        bankName:
          maxLength: 25
          minLength: 0
          type: string
          description: Name of the financial institution where the payment was accepted,
            Length 25
          example: 6mWigtACcWhjw3aARiVbnHQC7
        bankCity:
          maxLength: 13
          minLength: 0
          type: string
          description: City where the accepting financial institution is located,
            Length 13
          example: kU3wTso57iuQC
        transferType:
          pattern: '0[012]'
          type: string
          description: "Code representing the type of transaction. \n#### Valid codes:\
            \ \n00 - Cardholder payment \n01 - Returned/invalid account \n02 - Returned/other\
            \ reason"
          example: '00'
        referenceNumber:
          type: string
          description: Identifier of the original transaction
        acquirerReferenceIdentifier:
          type: string
          description: "Number identifying the original transaction. \nThis field\
            \ is required for transactions with R in the type field. You must enter\
            \ the reference number from the original transaction."
        arbitrationContactIdentifier:
          maxLength: 16
          minLength: 0
          type: string
          description: Message either indicating to send this transaction to the attention
            of the arbitration contact person or number identifying the assigned case.
            Max Length 16.
          example: YIrtWN9X1jzDnzXx
        memberName:
          maxLength: 25
          minLength: 0
          type: string
          description: Name of the member initiating the fee recovery transaction
          example: KIFHX8ALdvfsSqURkK5H1vFXo
        memberCity:
          maxLength: 13
          minLength: 0
          type: string
          description: Name of the city where the member initiating the fee recovery
            transaction is located
          example: JxnrMKHzaWIlr
        memberZip:
          pattern: '[0-9]{5}'
          type: string
          description: ZIP code or postal code of the member initiating the fee recovery
            transaction
          example: '13263'
        memberState:
          type: string
          description: Code representing the state or province of the member initiating
            the fee recovery transaction
        merchantNumber:
          type: string
          description: Telephone number of the merchant
        mvv:
          type: string
          description: Visa-assigned identifier of the merchant participating in a
            Visa select merchant fee program
    VisaIssuerAccountUpdateRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        segmentNumber:
          maxLength: 5
          minLength: 5
          type: string
          description: Visa-assigned identifier for the participating Visa Account
            Updater issuer, ODS field SGMN_ID
          example: QIYUc
        oldAccountIdentifier:
          maxLength: 19
          minLength: 12
          type: string
          description: "The type of identifier you enter in this field must match\
            \ the type you enter in the NEW ACCOUNT NUMBER/PI ID field.\n For example,\
            \ if you enter an account identifier in this field, enter an account identifier\
            \ in the NEW ACCOUNT NUMBER/PI ID field."
          example: h6z1zZBI4FPYsyQ7FWc
        oldExpirationDate:
          maxLength: 4
          minLength: 4
          type: string
          description: "Date of expiration for the original Visa account identifier\
            \ or presentation instrument,\n ODS field OLD_EXPR_DT. ODS format: YYMM"
          example: ZonT
        serviceIdentifier:
          maxLength: 1
          minLength: 1
          pattern: '[ACEOQ]'
          type: string
          description: "Code representing the type of service message to be sent in\
            \ the Issuer Submission File                                         \
            \                      Valid codes:\nA - Account changed message\nC -\
            \ Account change advice\nE - Expiration date change message\nO - Opt-in\
            \ or out (Internal Fiserv use only)\nThis setting depends on the value\
            \ in the OPT OUT field.\nQ - Contact cardholder advice\nWhen you set this\
            \ field to E, the date you enter in the NEW ACCOUNT/PI ID EXP DATE field\
            \ must\n be at least one month later than the old expiration date.\n \
            \ ODS field SRVC_ID."
          example: A
        newAccountIdentifier:
          maxLength: 19
          minLength: 12
          type: string
          description: "The type of identifier you enter in this field must match\
            \ the type you enter in the OLD ACCOUNT NUMBER/PI ID field. For example,\
            \ \nif you enter an account identifier in this field, enter an account\
            \ identifier in the OLD ACCOUNT NUMBER/PI ID field.\nThe NEW ACCOUNT NUMBER\
            \ field will contain the new account identifier when the transaction is\
            \ an account change. When the transaction is an expiration\ndate change,\
            \ the NEW ACCOUNT NUMBER field will contain the old account identifier.\
            \ This field will be blank when the transaction is identified as account\n\
            closed or contact cardholder in the SERVICE IDENTIFIER field.ODS field\
            \ NEW_ACCT_ID "
          example: xBAQBZhzczsXxAjP2cc
        newExpirationDate:
          maxLength: 4
          minLength: 4
          type: string
          description: 'Date of expiration for the new Visa account or presentation
            instrument

            The date you enter in this field must be at least one month later than
            the old expiration date when you set the SERVICE IDENTIFIER field to E,
            expiration date change message.

            This field will contain the new expiration date when provided. This field
            will be blank when the transaction is identified as an account closed
            or contact cardholder in the SERVICE IDENTIFIER field.

            ODS field NEW_EXPR_DT.

            '
          example: bUmZ
        reversalCode:
          maxLength: 1
          minLength: 0
          pattern: '[ACEQ]'
          type: string
          description: "Visa Account Updater Issuer Submission File Report (ISR) \n\
            Reversal Type Code representing the type of detail reversal to be sent\
            \ in the Issuer Submission File  Valid codes:\nA - Account change message\n\
            C - Account closed advice\nE - Expiration date change message\nQ - Contact\
            \ cardholder advice\nUse this field to reverse a previous transaction\
            \ update.\nODS field RVRS_CD.\n"
          example: Q
        conversionCode:
          maxLength: 1
          minLength: 0
          pattern: '[MV]?'
          type: string
          description: "Code representing whether FDR will convert a Mastercard account\
            \ to a Visa account  Valid codes:\nM - Non-Visa portfolio conversion\n\
            V - Visa portfolio conversion\nBlank - Not a portfolio conversion.\n ODS\
            \ field CNVR_CD."
          example: ''
        optionOutCode:
          maxLength: 1
          minLength: 0
          pattern: '[BO]?'
          type: string
          description: "Code representing the customer\uFFFDs participation in the\
            \ account update communication processValid codes:\nB - The customer accepts\
            \ participation (opts in).\nSetting the OPT OUT field to B instructs Fiserv\
            \ to send the customer\uFFFDs updated account information to Visa.\nO\
            \ - The customer declines participation (opts out).\nSetting the OPT OUT\
            \ field to O instructs Fiserv to omit the customer\uFFFDs updated account\
            \ information in files sent to Visa.\nblank - The customer accepts participation\
            \ (opts in).          If you leave this field blank, the System sets it\
            \ to B, indicating the customer\naccepts participation.\nWhen you update\
            \ an account that has a value of Q in the SERVICE IDENTIFIER field, the\
            \ System replaces the value of Q with R indicating an update was sent\
            \ to Visa.\n However, if the Q value stems from a lost or stolen account,\
            \ the System will retain the Q value and display it in the OPT OUT field.\n\
            ODS field OPT_OUT_CD."
          example: B
    VisaWarningBulletinRequest:
      required:
      - actionCode
      - exceptionPurgeDate
      - warningBulletinRegionCode
      - warningBulletinTypeCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        warningBulletinTypeCode:
          type: string
          description: 'Warning Bulletin Type Code - Code representing the type of
            WC, Visa Warning Bulletins transaction. Valid codes: 1 - Add this account
            to the customer exceptions file. 2 - Change this account''s information
            on the customer exceptions file. 3 - Delete this account from the customer
            exceptions file. 4 - Display the purge date, response code, and the warning
            bulletin regions for this account from the customer exceptions file. If
            you enter 4 for the WC transaction, the response from Visa will include
            an Action Indicator that designates whether the account was placed in
            the exceptions file or the warning bulletin. Action Indicators of 01,
            05, 11, or XA indicate exceptions file listings. Action Indicators of
            04, 07, 41, 43, or XD indicate warning bulletin listings'
        exceptionPurgeDate:
          type: string
          description: 'Exception Purge Date - Date the account is set to be automatically
            deleted from the customer exceptions file. Ods Format: MMDDYY'
        warningBulletinRegionCode:
          type: string
          description: 'Warning Bulletin Region Code - Code representing the warning
            bulletin region where the transaction occurred  Region code I identifies
            the internal region of the FDR Warning Bulletin Master File. Valid codes:
            0 - USA. A - Cananda. B - Central / South America. C - Asia. D - Europe.
            E - South Asia, Middle East and Africa. Z - All Regions (0 and A-E) ***Use
            Region Z for merchant processing only, not for listing accounts'
        actionCode:
          type: string
          description: 'Action Code - Code Valid codes for Visa:   01 - Do not approve
            or decline; call customer center. 04 - Decline authorization; pick up
            plastic. 05 - Decline authorization; do not pick up plastic because account
            is not fraudulent. 07 - Decline authorization; pick up plastic because
            plastic was obtained through fraud or counterfeit. 11 - Approve authorization;
            VIP account. 41 - Decline authorization; pick up plastic because plastic
            was reported lost. 43 - Decline authorization; pick up plastic because
            plastic was reported stolen. XA - Call customer center; approve authorization
            as a VIP account if customer center is not available. XD - Call customer
            center; decline authorization if customer center is not available; do
            not pick up plastic because account is not fraudulent'
        effectiveDate:
          type: string
          description: Effective Date - Date the warning bulletin listing becomes
            effective. Leave this field blank if you want to send an update to Visa
            or list a number only in the internal region of the FDR Warning Bulletin
            Master File. Enter the effective date if you want to update the FDR Warning
            Bulletin Master File without sending an update to Visa. If you enter an
            effective date, you must also enter an effective time.
        effectiveTime:
          type: string
          description: 'Effective Time - Time the listing becomes effective. Time
            appears as on a 24-hour clock in central time. Leave this field blank
            if you want to send an update to Visa or list a number only in the internal
            region of the FDR Warning Bulletin Master File. Enter the effective time
            if you want to update the FDR Warning Bulletin Master File without sending
            an update to Visa. If you enter an effective time, you must also enter
            an effective date. Ods Format: HHMMSS'
    WarningBulletinResponse:
      type: object
      properties:
        processorInfo:
          $ref: '#/components/schemas/ProcessorInfo'
        warningBulletinMessageNumber:
          type: string
        warningBulletinMessageText:
          type: string
          description: 'The message ** RESTRICTED CARD REQUEST SENT ** indicates that
            Visa / MasterCard is processing the WC/WB transaction. The message **
            RESTRICTED CARD REQUEST ACCEPTED ** appears after Visa / MasterCard has
            accepted the WC / WB transaction. If Visa / MasterCard rejects the WC
            / WB transaction, a reject message displays identifying the reason the
            transaction rejected. The transaction must be corrected and reentered. '
        warningBulletinReferenceNumber:
          type: string
        warningBulletinSeverity:
          type: string
        warningBulletinStatus:
          type: string
x-original-swagger-version: '2.0'
