        flag:
          pattern: '[CcPpSs]{1}'
          type: string
          description: 'Code representing whether to draw the automatic payment from
            the checking account or the savings account

            Valid codes:

            C - Checking account

            P - Code representing that an ACH prenoting request will be issued during
            the next nightly processing

            This code is valid for the formatted NM AF, Account Features transaction
            only. The System automatically displays P on the screen on the same day
            that you enter an ACH prenoting request.

            S - Savings account

            Needs to support all valid flag values. The flag is a one position value
            and is a required field'
          example: c
        transit:
          pattern: ^[0-9]{9}|[0-9]{0}$
          type: string
          description: Transit Needs to support the Transit field which is fixed length,
            nine positions and edited for numeric values.  This is an optional field.  (Transit
            routing number for Automated Clearinghouse prenoting)
          example: '190226341'
        dda:
          pattern: '[0-9a-zA-Z]{1,17}'
          type: string
          description: 'Saving/Checking account number for Automated Clearinghouse
            prenoting

            Length: variable length, 17 positions

            This is an optional field.

            Be aware that the information you enter in this field the System uses
            to generate an ACH prenotification only.'
          example: PmVcZj1FPtOgs7qM5
