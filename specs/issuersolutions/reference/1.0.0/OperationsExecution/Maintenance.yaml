  /maintenance/v2/updateAlwaysReferCode:
    post:
      tags:
      - Maintenance
      - Servicing
      - Operations & Execution
      - NM
      - Non-Mon
      - Non-Monetary
      - Non-Monetaries
      - Nonmon
      - Nonmons
      summary: NM*733
      description: "Use the NM*733, Always Refer Code transaction, to indicate whether\
        \ the account should always be referred for authorization processing. You\
        \ can use this transaction to set the always refer code for possibly fraudulent\
        \ accounts or to remove the always refer code so that all authorization requests\
        \ for an account will no longer be referred. The alwaysReferCode field works\
        \ in conjunction with the CVV Action Code and Auth W/O Certified Merch parameters\
        \ in the CVV/CVC Controls section (PF EC CV) of the Product Control File.\
        \ The CVV action code fields indicate the action that should be taken during\
        \ an authorization if the CVV/CVC is not valid. To have the System always\
        \ refer authorization requests after the first CVV/CVC failure, you must set\
        \ these fields to valid code 5 or 6. The first time a CVV/CVC failure occurs\
        \ for an account, these fields will instruct the System to issue a 'call me'\
        \ message and set the always refer code to refer this and all subsequent authorization\
        \ requests. The System automatically sets the always refer code to C after\
        \ a CVV/CVC failure if you have set your action codes on the Product Control\
        \ File to 5 or 6. The System automatically sets the always refer code to B\
        \ if you have set your Product Control File action codes to 5 or 6 and have\
        \ previously set the always refer code to F. Only valid codes B and C are\
        \ set automatically in the Authorizations system based on your Product Control\
        \ File settings. You can set valid code B manually if the System has already\
        \ set the always refer code to C. Valid code F must be set manually. You can\
        \ remove any always refer code by leaving this field blank. Required Fields:\
        \ common.accountId and alwaysReferCode. <br><br> <b>Relates to:</b>\n  \n\
        \  <blockquote style=\"border-left: 0.375em solid #40a9ff; background-color:\
        \ #e6f7ff; border-radius: 3px; padding: 1em;\" ><div>CNONMON 733 RPC, <a target=\"\
        _blank\" title=\"Click to open in a new tab\" href=\"https://documentation.fiserv.com/bundle/ODS/resource/ODS.pdf\"\
        > click here</a>.</div></blockquote>"
      operationId: updateAlwaysReferCode_v2_maintenance
      requestBody:
