    RemoveDisputeRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        disputeType:
          type: string
          description: 'Type of item to remove from dispute.

            Valid Codes:

            C - Cash Advance

            F - Full Balance Amount

            M - Merchandise Item.

            If you set this field to F, you must leave the amount and date fields
            blank or set them to zeros.

            This is a required field.'
        disputeAmount:
          type: string
          description: 'Amount of item to remove from dispute.

            This is a required field.

            Leave this field blank or set this field to zeros if you set this field
            to F. For example, 1000 is $10.00.'
        disputeDate:
          type: string
          description: 'Date the ticket posted to the account.

            Leave this field blank or set this field to all zeros if you set the disputeType
            field to F.

            ODS Format for this field is MMDDYY.'
        disputeEligibility:
          type: string
          description: 'Code representing whether you determined the item to be eligible
            for reinstated grace.

            Valid Codes:

            N - Item is not eligible for reinstated grace.

            Y - Item is eligible for reinstated grace.

            blank - Reinstated grace eligibility not provided.

            The system will process the dispute as eligible for reinstated grace.
            This is an optional field.'
        disputeFavor:
          type: string
          description: 'Code representing in whose favor you resolved the item.

            Valid Codes:

            B - Dispute resolved in favor of the issuer.

            C - Dispute resolved in favor of the customer.

            blank - Resolution favor not provided.

            The system will process the dispute as resolved in favor of the issuer.
            This is an optional field.'
    ResetPinRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        authorizationAttemptCounter:
          type: string
          description: 'Code representing the counter to reset The System resets the
            counters at the account level or the PI level depending on whether you
            use the account or PI identifier to enter this transaction and based on
            whether you track authorizations at the account or PI level. Valid codes:
            (1) E - Reset the excessive authorizations counter and/or the count of
            invalid CVV/CVC attempts allowed. If you use the PI identifier to enter
            the transaction and you track authorizations at the PI level, the System
            resets this counter at the PI level. Otherwise, it resets it at the account
            level. (2) J - Reset the total adjustment counter to zero. The System
            resets this counter at the account level only. (3) P - Reset the excessive
            PIN attempts counter. If you are a separate-entity processor, the System
            resets this counter at the PI level. This is the default value.'
    ResponseMessage:
      type: object
