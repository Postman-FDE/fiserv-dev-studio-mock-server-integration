          description: Method name assigned to the plan identifying the pricing method
            used for the promotional balance associated with the plan.
        referenceNumber:
          maxLength: 23
          minLength: 0
          type: string
          description: Identifier of the item being posted. Leave this field blank
            unless you are entering a reversal or amount adjustment that has aged
            off the CIS files. Refer to the reference identifier that appears on the
            appropriate report. Maximum field length is 17 positions.
          example: 9SeYQcWPrdCb3TcldpA4KK6
        retailTermsCode:
          maxLength: 4
          minLength: 4
          type: string
          description: Retail Terms Code. Client-defined code representing the ticket
            terms under which the promotional purchase was processed. This is a fixed
            four position field.
          example: mHgA
        transactionAmount:
          pattern: \d{1,11}\.\d{2}
          type: string
          description: Amount of the item being adjusted or posted. For transaction
            codes 259, 260, 261, and 273, enter the original amount here. For transaction
            codes 372-385, enter the last statement balance. Expected format is 9.99
            with a maximum length of 14, including the decimal point.
          example: '8086420.86'
        transactionFeeAttributeCode:
          maxLength: 3
          minLength: 0
          type: string
          description: Identifier of the type of discounted interchange rate applicable
            for this transaction. Use this field only for transaction codes 256, 257,
            258, 259, 260, and 261. Maximum field length is three positions.
          example: rlL
        transactionIdentifier:
          type: string
          description: Visa or First Data assigned identifier of the transaction during
            a chargeback, retrieval, or fraud advice transaction.
        transactionItemFeeMethodIdentifier:
          maxLength: 8
          minLength: 0
          type: string
          description: 'Identifier of the item fee method used to process the transaction.
            Enter an item fee method in this field to identify the transaction level
            fees for an adjustment or reversal. You can only enter information in
            this field for the following transaction codes: 256, 257, 259, and 260.
            Maximum field length is 8 positions.'
          example: HOrBfwhK
        transactionPostingDate:
          type: string
          description: 'Date the original transaction posted to the customer account.
            Leave this field blank unless you are entering a reversal or amount adjustment
            that has aged off the CIS files. Refer to the posting date identifier
            that appears on the appropriate report. Ods Format: MMDDYY. '
        interchangeRate:
          type: string
          description: This field is reserved for restricted used.
        cardAcceptorIdentifier:
          type: string
          description: This field is reserved for restricted used.
        monetaryRejectOverrideIndicator:
          pattern: 'Y| '
          type: string
          description: Monetary reject override indicator
          example: Y
        previousBalanceIdentifier:
          pattern: \d{0,7}
          type: string
          description: Previous balance identifier
          example: '2872'
        bypassCode:
          pattern: '[B ]'
          type: string
          description: "Code determining whether the reversal or transaction adjustment\
            \ is eligible to bypass \nthe supervisor review queuing feature of the\
            \ JRQ, Adjustment Review Queue Display Transaction\nValid codes in comments.\n\
            .#### Example Values: \n  blank - If the adjustment or reversal request\
            \ exceeds the amount established for an operator,           or a value\
            \ is entered in either the merchant description or merchant description\
            \ override fields,           automatically send the transaction to a supervisor\
            \ to review \n  B - Do not queue the adjustment or reversal request to\
            \ the JRQ transaction. \n"
          example: B
        disputeIdentifier:
          maxLength: 36
          minLength: 1
          type: string
          description: 'Transformed Dispute Universal Unique Identifier Code

            ODS Field TRNF_DSPT_UUID_CD'
          example: ytb16e2ITeyphN9PtOarS0M6KMldSfgaPB03
    AmexSecurityDetailAddRequest:
      required:
      - acquirerReferenceNumber
      - acquiringInstitutionIdentifier
      - acquiringInstitutionProcessorIdentifier
      - americanExpressTransactionIdentifier
      - billingCurrencyCode
      - billingDecimalPlacesCount
      - billingTransactionAmount
      - chargebackReasonCode
      - chargebackStatusCode
      - fraudCurrencyCode
      - fraudDecimalPlacesCount
      - fraudReportDate
      - fraudReportTime
      - fraudTransactionAmount
      - fraudTransactionProcessingDate
      - fraudTypeCode
      - merchantAccountIdentifier
      - merchantAddressLine1Text
      - merchantAddressLine2Text
      - merchantCategoryCode
      - merchantCommonName
      - merchantCountryCode
      - originalBillingTransactionDate
      - originalEnteredCurrencyCode
      - originalEnteredDecimalPlacesCount
      - originalEnteredTransactionAmount
      - originalTransactionAmount
      - originalTransactionCurrencyCode
      - originalTransactionDecimalPlacesCount
      - presentationInstrumentExpirationDate
      - processorTransactionIdentifier
      - recordUpdateIndicator
      - transactionCode
      - transactionDate
      - transactionIdentifierSourceInstitutionCode
      - transactionPostDate
      - transactionTime
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        presentationInstrumentExpirationDate:
          maxLength: 4
          minLength: 4
          type: string
          description: 'Date the plastic expires. Format: MMYY.'
          example: iuGY
        presentationInstrumentActivatedTerminalIdentifier:
          maxLength: 8
          minLength: 1
          type: string
          description: Identifier of the terminal at the merchant location where the
            authorization was initiated.
          example: rbLZek8o
        americanExpressTransactionIdentifier:
          maxLength: 15
          minLength: 1
          type: string
          description: American Express-assigned identifier of the transaction.
          example: AjqCJMAVIm05PuT
        processorTransactionIdentifier:
          maxLength: 15
          minLength: 15
          type: string
          description: Fiserv-assigned identifier assigned to a transaction.
          example: IFZ2dE8S5lPsTQC
        transactionCode:
          pattern: ^(253|254|255|599)$
          type: string
          description: Code presenting the type of monetary transaction. 253=Sale,
            254=Cash advance, 255=Return, 599=Restitution.
          example: '253'
        transactionIdentifierSourceInstitutionCode:
          pattern: \d{1,3}
          type: string
          description: Fiserv code used to identify the institution that assigned
            the transaction identifier and indicating whether the transaction qualifies
            for Custom Payment Services (CPS)
          example: '7'
        transactionDate:
          maxLength: 6
          minLength: 6
          type: string
          description: 'Date the transaction occurred. Format: MMDDYY.'
          example: '0oRB3Y'
        transactionTime:
          pattern: ^([01][0-9]|2[0-3])([0-5][0-9])([0-5][0-9])$
          type: string
          description: 'Time the transaction occurred. Format: HHMMSS.'
          example: '212801'
        transactionPostDate:
          maxLength: 6
          minLength: 6
          type: string
          description: 'Date the original transaction posted to the customer account.
            Format: MMDDYY.'
          example: GvNcG2
        fraudTransactionAmount:
          maxLength: 15
          minLength: 1
          type: string
          description: "Total amount of the fraud transaction in the AEGN Issuer\u2019\
            s settlement currency identified in the FRAD_CNCY_CD parameter."
          example: 5wfKYwCld3A47O4
        fraudAuthorizationCode:
          maxLength: 6
          minLength: 1
          pattern: \d{6}
          type: string
          description: Identifier of the authorization approval.
          example: '107100'
        fraudStatusDispositionCode:
          maxLength: 2
          minLength: 2
          pattern: ^(F0|F1|F2|F3|F4|F5|F6)$
          type: string
          description: Client-defined code representing the status of the fraudulent
            transaction.
          example: F1
        fraudReportDate:
          maxLength: 6
          minLength: 6
          type: string
          description: 'Local date the customer reported the fraud to the issuer.
            Format: MMDDYY.'
          example: KPbfAn
        fraudReportTime:
          maxLength: 6
          minLength: 6
          type: string
          description: 'Local time the customer reported the fraud to the issuer.
            Format: HHMMSS.'
          example: sWiV5X
        fraudTypeCode:
          maxLength: 2
          minLength: 1
          type: string
          description: Code representing the type of fraud. 00=Card reported lost,
            01=Card reported stolen, 02=Card not received, 03=Fraudulent application,
            04=Counterfeit, 05=Account takeover, 06=Mail/telephone order, 07=Imprinting
            of multiple sales drafts, 17=Card not present, 24=Convenience check fraud,
            26=Skimmed fraud.
          example: TU
        fraudCurrencyCode:
          pattern: \d{3}
          type: string
          description: Code representing the currency in the FRAD_TRAN_AM parameter
