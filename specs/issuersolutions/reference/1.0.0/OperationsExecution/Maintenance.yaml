      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        code:
          maxLength: 2
          minLength: 2
          type: string
          description: 'Monetary field to change. Length: fixed length, 2 positions

            Valid codes:

            01 - Change TYPE (LAST MONETARY) field

            02 - Change DATE (LAST MONETARY) field

            03 - Change DATE (LAST PAYMENT) field

            05 - Change FIRST ACTIVE DATE field

            06 - Change LAST STATUS CHANGE DATE field

            07 - Change AMOUNT (LAST PAYMENT) field

            08 - First Data use only

            09 - First Data use only

            10 - First Data use only

            11 - First Data use only

            12 - Change 12 MONTH ACTIVITY HISTORY field

            13 - Change LAST DISPUTE DATE field

            14 - Change DAYS IN LAST BILLING CYCLE field

            15 - Change PAY HISTORY 13-24 MONTHS field'
          example: '31'
        data:
          type: string
          description: 'Information for the field you specified in the CODE field.

            If you entered 01, 02, 03, 05, 06, 07, 13, or 14 in the CODE field, this
            is a required field.

            If you entered 12 or 15 in the CODE field, this is an optional field.

            However, if you leave any of the positions in this field blank, the existing
            information in that position of the field will be deleted.'
