          items:
            $ref: '#/components/schemas/ResponseMessage'
        messageMap:
          type: object
          additionalProperties:
            type: string
          description: Map of messages to ods responses from server.
          example: {}
    AddFeeProgramRequest:
      required:
      - feeAmount
      - feeAssessmentNumber
      - feeProgramName
      - nextFeeDate
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        feeProgramName:
          maxLength: 8
          minLength: 1
          type: string
          description: This field displays the fee program name.
          example: Lx64NRJC
        feeAmount:
          pattern: \d{1,13}
          type: string
          description: 'This field displays all

            nines when the fee amount is determined by the Product Control File

            setting for the Fee Amount parameter in the Fee Program section (FP

            FP FP). If this field contains an amount other than all nines, it is the

            override fee amount this individual cardholder is assessed for this fee

            program.'
          example: '440904'
        nextFeeDate:
          pattern: \d{8}
          type: string
          description: 'The NEXT field displays

            the next date (MM/DD/YY) the System will assess the fee amount as

            indicated by the timing parameters in the Fee Program section

            (FP FP FP) of the Product Control File. This field is set to 99/99/99
            if the

            fee program has been deleted.'
          example: '99388509'
        feeAssessmentNumber:
          pattern: \d{1,3}
          type: string
          description: Fee Assessment Number
          example: '3'
    AdditionalCrossReferenceNumberRequest:
      required:
      - field
      - xref
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        field:
          pattern: 1|2
          type: string
          description: 'FIELD - Code representing which additional cross-reference
            account

            number to change

            Valid codes:

            1 - Change additional cross-reference account #1.

            This field changes an account''s cross-reference account number 2

            on the Cardholder Master File. Cross-reference numbers appear on

            an account''s Balance and Status display.

            2 - Change additional cross-reference account #2.

            This field changes an account''s cross-reference account number 3

            on the Cardholder Master File. Cross-reference numbers appear on

            an account''s Balance and Status display.

            '
          example: '1'
        xref:
          type: string
          description: 'XREF - Information for the cross-reference account number
            specified in

            the FIELD field'
    AdjustmentTransactionRequest:
      required:
      - batchType
