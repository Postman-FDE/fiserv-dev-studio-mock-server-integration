    UpdateDuplicateCorrespondenceCodeForLettersRequest:
      required:
      - duplicateCorrespondenceCodeForLetters
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        duplicateCorrespondenceCodeForLetters:
          type: string
          description: "Code representing whether you authorize the System to produce\
            \ a letter for the secondary customer, or any secondary or additional\
            \ names customers who share liability for the account, in addition to\
            \ the letter for the account\uFFFDs principal customer.\n#### Valid Codes:\n\
            **A**: Yes, produce a separate letter for any secondary or additional\
            \ names customers with an ECOA code of 2, joint contractual liability.\n\
            If the secondary customer does not have an ECOA code of 2, no letter is\
            \ produced for that customer.\n**N**: No, do not produce a letter for\
            \ the secondary customer or for any additional names customers who share\
            \ liability for the account.\n**Y**: Yes, produce a separate letter and\
            \ mail it to the secondary customer. The System accepts your entry of\
            \ this value only if the account has\na secondary customer. "
    UpdateDuplicateCorrespondenceCodeForPlasticsRequest:
      required:
      - duplicateCorrespondenceCodeForPlastics
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        duplicateCorrespondenceCodeForPlastics:
          type: string
          description: 'Indicator designating whether you produce a separate card
            carrier for the secondary customer in addition to the card carrier for
            the account''s principal customer.

            #### Valid codes:

            **N**: No, do not produce or send a separate card carrier for the secondary
            customer.

            **Y**: Yes, produce a separate card carrier and mail it to the secondary
            customer.

            The System accepts your entry of this value only if the account has a
            secondary customer. '
    UpdateDuplicateCorrespondenceCodeRequest:
      required:
      - duplicateCorrespondenceCode
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        duplicateCorrespondenceCode:
          type: string
          description: "Indicator designating whether you produce a duplicate statement\
            \ for the secondary customer in addition to the regular statement for\
            \ the account\uFFFDs principal customer. Valid codes: N - No, do not produce\
            \ a duplicate statement for the secondary customer. Y - Yes, produce a\
            \ duplicate statement and mail it to the secondary customer. The System\
            \ accepts this code only if a secondary customer is on the account. "
    UpdateEquityAccountMaturityDateRequest:
      required:
      - equityAccountMaturityDate
      - overrideFlag
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        equityAccountMaturityDate:
          type: string
          description: 'Date the account is due for renewal or the date loan matures.
            Format: MMDDYY '
        overrideFlag:
          pattern: '[NY]?'
          type: string
          description: 'Indicator designating whether to allow a new maturity date
            outside the valid range established by the product control file  Valid
            codes N - No, don''t override the product control file settings  Y - Yes,
            override the product control file valid range, and enter the new date
            on card holder account record. blank -  No, don''t override the product
            control file settings '
          example: ''
    UpdateExpirationDateRequest:
      required:
      - expirationDate
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        expirationDate:
          type: string
          description: 'The expiration date for the cardholder account record. ODS
            Format is MMDDYY. This is a required field.

            The plastic will expire at the end of the month regardless of which day
            you enter. Therefore, you should enter the last day of the month in this
            field.

            Fill this field with nines to indicate a nonexpiring account.

            If the account''s plastic is eligible for reissue and you set the expiration
            date to expire during the current cycle, the System will automatically
            close the account after the next month''s cycle. For example, if on October
            19th you enter an expiration date of October 31st for a plastic that is
            eligible for reissue, the System will complete the reissue process and
            then automatically close the account on November 30th.

            This field changes an account''s expiration date on the cardholder account
            record. It does not cause the generation of a new plastic.

            When either of the following conditions exist, the expiration date you
            enter in this field must be less than or equal to the date that is part
            of the condition.

            1. The account maturity date on the cardholder account record is set to
            a value greater than zero, and the Expiration Date Override ID parameter
            in the Reissue Options section (RE OP RO) of the Product Control File
            is set to 2.

            2. The draw period end date on the cardholder account record is set to
            a value greater than zero, and the Expiration Date Override ID parameter
            is set to 3. '
    UpdateExternalStatusAndReasonCodeRequest:
      type: object
      properties:
        common:
          $ref: '#/components/schemas/AccountHeader'
        externalStatusCode:
          type: string
          description: "Code determining the external status for the account.\n ####\
            \ Valid Codes:\n**A** - Authorization prohibited\n**B** - Bankrupt\n**C**\
            \ - Closed\n**E** - Revoked\n**F** - Frozen\n**I** - Interest accrual\
            \ prohibited\n**L** - Lost\n**U** - Stolen\n**Z** - Charged off\n**blank**\
            \ - Normal.\nThe System assigns status Z when a charge-off adjustment\
            \ is made."
        externalStatusReasonCode:
          type: string
          description: 'Issuer-defined code representing the reason for the external
            status.

            For an external status of C (closed), the following status reason codes
            indicate that the System closed the account for the listed reason.

            #### Status reason codes:

            **85** - Closed due to your Adaptive Control overlimit strategy

            **86** - Closed due to your Adaptive Control delinquent strategy

            **87** - Closed due to your Adaptive Control reissue strategy

            **90** - Closed due to your setting in the delinquency action code parameters
            in the Delinquency Processing section (DO DC DP) of the Product Control
            File

            **91** - An old account closed after an account transfer due to your settings
            in the Automatic Close Days After Transfer and Status Reason Code Overlay
            Switch parameters in the Account Maintenance section (AO CH AM) of the
            Product Control File

            **92** - Closed in the reissue process due to your setting in the delinquent
            and overlimit parameters in the Eligibility section (RE CR EL) of the
            Product Control File

            **93** - Closed in the reissue process due to your settings in the Reissue
            Terms parameter in the Eligibility section (RE CR EL) of the Product Control
            File and the Ratification Level parameter in the Debit Ratification section
            (AO AC DR) of the Product Control File

            **94** - Closed in the reissue process due to your settings in the Include/exclude
            States and Reissue States parameters in the Eligibility section (RE CR
            EL) of the Product Control File

            **95** - Closed in the reissue process due to an external status other
            than A or blank

            **96** - Closed in the reissue process due to your setting in the Inactive
            Option parameter in the Reissue Options section (RE OP RO) of the Product
            Control File

            **97** - Closed by consumer.

            For an external status of Z (charged off), the following status reason
            codes indicate that the charge-off is for the listed reason.

            #### Status reason codes:

            **68** - Legally paid in full for less than the full balance

            **88** - Fraud

            **89** - Bankrupt

            **99** - Abandoned. '
    UpdateGeographicCodeRequest:
