openapi: 3.0.1
info:
  title: Silvercore™ Alerts Service - API Documentation
  description: This documentation describes the REST APIs provided by the Silvercore™
  version: "2.0"
servers:
  - url: https://int.latam.api.fiservapps.com/latam-gfs-new-apis/v2/
    description: Sandbox Test
paths:
  /alerts/accounts/v1/alerts/{alertId}:
    put:
      tags:
        - Modify
      summary: La API hace la modificacion de una alerta, asociando la alerta a un usuario y una entidad.
      operationId: subscription
      parameters:
        - name: X-ClientID
          in: header
          description: Número que representa la entidad cliente del servicio en Fiserv.
          required: true
          schema:
            pattern: '[0-9]{1,3}'
            type: string
            description: Número que representa la entidad cliente del servicio en Fiserv.
        - name: username
          in: header
          description: Identificador que representa al usuario.
          required: true
          schema:
            type: string
            description: Identificador que representa al usuario.
        - name: security-context
          in: header
          required: false
          schema:
            type: string
        - name: requestId
          in: header
          description: ' Identificador único global de la solicitud enviada con formato de dígitos hexadecimales con grupos separados por guiones. Ejemplo: b3d27f9b-d21d-327c-164e-7fb6776f87b0'
          required: false
          schema:
            type: string
            description: ' Identificador único global de la solicitud enviada con formato de dígitos hexadecimales con grupos separados por guiones. Ejemplo: b3d27f9b-d21d-327c-164e-7fb6776f87b0'
        - name: alertId
          in: path
          description: "Este campo de entrada proporciona el id de la alerta, pueden ser los Valores:\r\n•\t1: Transacción por monto;\r\n•\t2: Transacciones por monto acumulado;\r\n•\t3: Vencimiento del Estado de Cuenta;\r\n•\t4: Transacciones a plazos por monto acumulado;\r\n•\t6: Caducidad de la credencial.\r\n"
          required: true
          schema:
            pattern: ^[0-9]{1}
            type: string
            description: "Este campo de entrada proporciona el id de la alerta, pueden ser los Valores:\r\n•\t1: Transacción por monto;\r\n•\t2: Transacciones por monto acumulado;\r\n•\t3: Vencimiento del Estado de Cuenta;\r\n•\t4: Transacciones a plazos por monto acumulado;\r\n•\t6: Caducidad de la credencial.\r\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSubscribeRequest'
        required: true
      responses:
        '204':
          description: No Content
          content:
            application/json: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Response 1:
                  description: Validation of required fields
                  value:
                    fieldName1: string
                    fieldName2: string
                Response 2:
                  description: Mainframe message
                  value:
                    errorResponse:
                      code: 0
                      description: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFiserVResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFiserVResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailsResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFiserVResponse'
      x-proxy-name: Modify
      x-group-name: Alerts
      x-child-product-name: Cards
    delete:
      tags:
        - Unsuscribe
      summary: La API hace la baja de una suscripción de una alerta
      operationId: unsubscription
      parameters:
        - name: X-ClientID
          in: header
          description: Número que representa la entidad cliente del servicio en Fiserv.
          required: true
          schema:
            pattern: '[0-9]{1,3}'
            type: string
            description: Número que representa la entidad cliente del servicio en Fiserv.
        - name: username
          in: header
          description: Identificador que representa al usuario.
          required: true
          schema:
            type: string
            description: Identificador que representa al usuario.
        - name: security-context
          in: header
          required: false
          schema:
            type: string
        - name: requestId
          in: header
          description: ' Identificador único global de la solicitud enviada con formato de dígitos hexadecimales con grupos separados por guiones. Ejemplo: b3d27f9b-d21d-327c-164e-7fb6776f87b0'
          required: false
          schema:
            type: string
            description: ' Identificador único global de la solicitud enviada con formato de dígitos hexadecimales con grupos separados por guiones. Ejemplo: b3d27f9b-d21d-327c-164e-7fb6776f87b0'
        - name: alertId
          in: path
          description: "Este campo de entrada proporciona el id de la alerta, pueden ser los Valores:\r\n•\t1: Transacción por monto;\r\n•\t2: Transacciones por monto acumulado;\r\n•\t3: Vencimiento del Estado de Cuenta;\r\n•\t4: Transacciones a plazos por monto acumulado;\r\n•\t6: Caducidad de la credencial.\r\n"
          required: true
          schema:
            pattern: ^[0-9]{1}
            type: string
            description: "Este campo de entrada proporciona el id de la alerta, pueden ser los Valores:\r\n•\t1: Transacción por monto;\r\n•\t2: Transacciones por monto acumulado;\r\n•\t3: Vencimiento del Estado de Cuenta;\r\n•\t4: Transacciones a plazos por monto acumulado;\r\n•\t6: Caducidad de la credencial.\r\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUnsubscribeRequest'
        required: true
      responses:
        '204':
          description: No Content
          content:
            application/json: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Response 1:
                  description: Validation of required fields
                  value:
                    fieldName1: string
                    fieldName2: string
                Response 2:
                  description: Mainframe message
                  value:
                    errorResponse:
                      code: 0
                      description: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFiserVResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFiserVResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailsResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFiserVResponse'
      x-proxy-name: Unsuscribe
      x-group-name: Alerts
      x-child-product-name: Cards
