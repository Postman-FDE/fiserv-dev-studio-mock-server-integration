components:
  schemas:
    ErrorDetailsResponse:
      type: object
      properties:
        dateError:
          type: string
          format: date-time
        message:
          type: string
        detail:
          type: string
    AlertSubscribeRequest:
      required:
        - accountNumber
        - additional
        - cardNumber
      type: object
      properties:
        accountNumber:
          pattern: ^[0-9A-F]{32}$
          type: string
          description: Este campo de entrada, permite ingresar el número de cuenta del tarjetahabiente encriptado.
          example: B47A195B4DF76B04D036F0A8FFEF4416
        additional:
          pattern: ^[0-9]{1}
          type: string
          description: Este campo de entrada, complementa al dato cuenta para identificar unívocamente Titulares y Adicionales de la misma. Conocido también como "AUTORIZADO"
          example: '0'
        cardNumber:
          pattern: ^[0-9A-F]{64}$
          type: string
          description: Este campo de entrada permite ingresar el número de tarjeta (PAN) encriptado
          example: FCBDA6EEB6BE198F41D19D38C8B7AD1F66C91533A439A78F006628214AB6A02E
        alert:
          $ref: '#/components/schemas/ApiAlert'
      description: Estructura de campos para la solicitud de subcripción de una alerta
    ApiAlert:
      required:
        - contact
      type: object
      properties:
        parameters:
          $ref: '#/components/schemas/Parameters'
        contact:
          type: array
          description: Lista de tipos de envío de alerta
          items:
            $ref: '#/components/schemas/ApiSendTypeMethod'
      description: Este campo de entrada hace referencia al objeto Alerta que se data de alta.
      oneOf:
        - $ref: '#/components/schemas/ApiAlertComplete'
    ApiAlertComplete:
      required:
        - contact
        - id
      type: object
      properties:
        parameters:
          $ref: '#/components/schemas/Parameters'
        contact:
          type: array
          description: Lista de tipos de envío de alerta
          items:
            $ref: '#/components/schemas/ApiSendTypeMethod'
        id:
          maximum: 6
          minimum: 1
          type: integer
          description: "Este campo de entrada proporciona el id de la alerta, pueden ser los Valores:\r\n•\t1: Transacción por monto;\r\n•\t2: Transacciones por monto acumulado;\r\n•\t3: Vencimiento del Estado de Cuenta;\r\n•\t4: Transacciones a plazos por monto acumulado;\r\n•\t6: Caducidad de la credencial.\r\n"
          format: int32
        numeroValido:
          type: boolean
      description: Este campo de salida, proporciona la lista de alertas encontradas
      example:
        alerts:
          - parameters:
              amount: null
              operationState: null
              location: null
            contact:
              - sendMethod: MAIL
                value: null
            id: 3
          - parameters:
              amount: '850'
              operationState: TODOS
              location: AR
            contact:
              - sendMethod: MAIL
                value: null
            id: 1
    ApiSendTypeMethod:
      required:
        - sendMethod
        - value
      type: object
      properties:
        sendMethod:
          type: string
          description: 'Este campo de entrada, permite ingresar el tipo de envío, ejemplo: </br>MAIL</br>SMSPUSH'
          example: MAIL
          enum:
            - MAIL
            - SMS
            - PUSH
        value:
          pattern: ^.{0,60}$
          type: string
          description: Valor de Contacto según el Tipo de Contacto
          example: example@fiserv.com
      description: Lista de tipos de envío de alerta
    Parameters:
      required:
        - amount
        - location
        - operationState
      type: object
      properties:
        amount:
          pattern: ^(0|[1-9]\d{0,12})(\.\d{1,2}?$)
          type: string
          description: |
            Amount 
             Required when alertId is 1, 2, or 4 
            Monto mínimo a partir del cual se genera la Alerta por compra. Longitud máxima 15. Formato: EEEEEEEEEEEEE.DD
          example: '185000'
        operationState:
          pattern: (APROBADA|RECHAZADA|TODOS)
          type: string
          description: "operationState \n Required when alertId is 1 \nEstado de la operación de compra por el cual se genera la Alerta.\r\nValores:\r\n•\tAPROBADA,\r\n•\tRECHAZADA,\r\n•\tTODOS.\r\n"
          example: TODOS
        location:
          pattern: ^[a-zA-Z]{1,5}$
          type: string
          description: Proporciona la opción de ingresar la abreviatura de dos letras del país (localidad) de la operación de compra a generar la alerta o la opción TODAS. ISO-3166 ALPHA-2 ISO-3166 ALPHA-2
          example: ARG
      description: Este campo de entrada, permite ingresar un objecto con los parametros de la alerts
    ErrorFiserVDetailsResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        description:
          type: string
    ErrorFiserVResponse:
      type: object
      properties:
        errorResponse:
          $ref: '#/components/schemas/ErrorFiserVDetailsResponse'
    AlertSearchRequest:
      required:
        - accountNumber
        - additional
        - cardNumber
      type: object
      properties:
        accountNumber:
          pattern: ^[0-9A-F]{32}$
          type: string
          description: Este campo de entrada, permite ingresar el número de cuenta del tarjetahabiente encriptado.
          example: B47A195B4DF76B04D036F0A8FFEF4416
        additional:
          pattern: ^[0-9]{1}
          type: string
          description: Este campo de entrada, complementa al dato cuenta para identificar unívocamente Titulares y Adicionales de la misma. Conocido también como "AUTORIZADO"
          example: '0'
        cardNumber:
          pattern: ^[0-9A-F]{64}$
          type: string
          description: Este campo de entrada permite ingresar el número de tarjeta (PAN) encriptado
          example: FCBDA6EEB6BE198F41D19D38C8B7AD1F66C91533A439A78F006628214AB6A02E
      description: Estructura de campos para la solicitud de subcripción de una alerta
    ApiAlertAlertSearchResponse:
      type: object
      properties:
        alerts:
          type: array
          description: Este campo de salida, proporciona la lista de alertas encontradas
          example:
            alerts:
              - parameters:
                  amount: null
                  operationState: null
                  location: null
                contact:
                  - sendMethod: MAIL
                    value: null
                id: 3
              - parameters:
                  amount: '850'
                  operationState: TODOS
                  location: AR
                contact:
                  - sendMethod: MAIL
                    value: null
                id: 1
          items:
            $ref: '#/components/schemas/ApiAlertComplete'
      description: Estructura de campos que responde la API AlertSearch
    AlertUnsubscribeRequest:
      required:
        - accountNumber
        - additional
        - cardNumber
      type: object
      properties:
        accountNumber:
          pattern: ^[0-9A-F]{32}$
          type: string
          description: Este campo de entrada, permite ingresar el número de cuenta del tarjetahabiente encriptado.
          example: B47A195B4DF76B04D036F0A8FFEF4416
        additional:
          pattern: ^[0-9]{1}
          type: string
          description: Este campo de entrada, complementa al dato cuenta para identificar unívocamente Titulares y Adicionales de la misma. Conocido también como "AUTORIZADO"
          example: '0'
        cardNumber:
          pattern: ^[0-9A-F]{64}$
          type: string
          description: Este campo de entrada permite ingresar el número de tarjeta (PAN) encriptado
          example: FCBDA6EEB6BE198F41D19D38C8B7AD1F66C91533A439A78F006628214AB6A02E
      description: Estructura de campos para la solicitud de subcripción de una alerta
