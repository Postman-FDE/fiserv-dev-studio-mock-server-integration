$kind: http-example
name: Add IssuerSolutions ODS-Inquiry 1.0.0 (over 3MB size limit)
request:
  url: "{{base_url}}/events"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tenantName": "IssuerSolutions",
        "branchName": "develop",
        "added": [
          "issuersolutions/reference/1.0.0/internal/ODS-Inquiry.yaml"
        ],
        "modified": [],
        "removed": []
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "results": [
          {
            "filePath": "issuersolutions/reference/1.0.0/internal/ODS-Inquiry.yaml",
            "operation": "ADDED",
            "status": "FAILED",
            "message": "400 Bad Request: document exceeds the maximum allowed size of 3145728 code points"
          }
        ]
      }
